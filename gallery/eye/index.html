/* curves sampled frame by frame from the video (24 fps), smoothed with monotone Hermite */
function mono(pts) {
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], h = a * a + b * b;
    if (h > 9) { const k = 3 / Math.sqrt(h); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; }
  }
  return t => {
    if (t <= xs[0]) return ys[0];
    if (t >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (t > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], s = (t - xs[i]) / h, s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * ys[i] + (s3 - 2 * s2 + s) * h * m[i] + (3 * s2 - 2 * s3) * ys[i + 1] + (s3 - s2) * h * m[i + 1];
  };
}

const SPREAD = mono([[7.25, 631.5], [7.292, 630], [7.333, 620.5], [7.375, 604.5], [7.417, 573.5], [7.458, 518], [7.5, 393.5], [7.542, 123.5], [7.583, 228.5], [7.625, 262.5], [7.667, 274.5]]);
const STACK_ROT = mono([[7.5, 0], [7.521, 50], [7.542, 88], [7.583, 90]]);
const R_MID = mono([[7.5, 326.5], [7.542, 298], [7.583, 183], [7.625, 144.5], [7.667, 122.5]]);
const R_END = mono([[7.5, 326.5], [7.542, 240], [7.583, 183], [7.625, 144.5], [7.667, 122.5]]);
const STACK_Y = mono([[7.5, 540], [7.542, 543.5], [7.583, 538.5], [7.625, 541.5]]);
const circles = [0, 1, 2].map(() => el('circle', { fill: C.white }, $('circles')));
function sceneF(t) {
  const morphing = t >= MORPH0 && t < MORPH1;
  show($('morphs'), morphing); show($('circles'), t >= MORPH1);
  if (morphing) { const p = prog(t, MORPH0, MORPH1, 'power1.inOut'); morphFns.forEach((f, i) => morphPaths[i].setAttribute('d', f(p))); return; }
  if (t < 7.25) {
    const r = CIRC_R(t), x1 = C1X(t), x3 = C3X(t);
    [x1, (x1 + x3) / 2, x3].forEach((x, i) => set(circles[i], { cx: x, cy: 540, r }));
  } else if (t < 7.5) {
    const d = SPREAD(t), r = CIRC_R(t);
    [-1, 0, 1].forEach((k, i) => set(circles[i], { cx: 958.5 + k * d, cy: 540, r }));
  } else {
    const d = SPREAD(t), a = STACK_ROT(t) * Math.PI / 180, cy = STACK_Y(t);
    [-1, 0, 1].forEach((k, i) => set(circles[i], { cx: 958.5 + k * d * Math.cos(a), cy: cy + k * d * Math.sin(a), r: k ? R_END(t) : R_MID(t) }));
  }
}

/* ================= SHOTS 10-11: the traffic light, the bottom lights up in blue (7.58 -> 8.65 s) ================= */
const LIGHT_Y = [267, 541.5, 816];
const lights = LIGHT_Y.map(y => el('circle', { cx: 959, cy: y, r: 122.5, stroke: C.white, 'stroke-width': 4 }, $('lights')));
const BOX_OP = mono([[7.562, 0], [7.583, 0.25], [7.625, 1]]);
const FILL_TOP = t => t < 7.646 ? C.white : t < 7.688 ? '#A20000' : t < 7.729 ? '#F50200' : C.red;
const FILL_OFF = t => t < 7.646 ? C.white : t < 7.688 ? '#6A6A66' : C.black;
function sceneG(t) {
  $('tlBox').setAttribute('stroke-opacity', BOX_OP(t).toFixed(3));
  const on = t >= 7.646;
  show($('lights'), on);
  if (on) {
    lights[0].setAttribute('fill', FILL_TOP(t)); lights[1].setAttribute('fill', FILL_OFF(t));
    lights[2].setAttribute('fill', t >= 8.146 ? C.light : FILL_OFF(t));
  }
  set($('glowR'), { cx: 959, cy: 267, r: 128, 'fill-opacity': 0.45 * prog(t, 7.66, 7.72, 'power1.out') });
  const fb = t >= 8.146 ? 0.42 + 0.3 * (1 - prog(t, 8.146, 8.35, 'power2.out')) : 0;   // flash then glow
  set($('glowB'), { cx: 959, cy: 816, r: 128, 'fill-opacity': fb });
}

/* ================= SHOTS 11-12: NOTICE, the eye closes into a line (8.54 -> 10 s) ================= */
const NOTICE_BOX = [['N', 4, 360], ['O', 394, 732], ['T', 729, 1088], ['I', 1105, 1234], ['C', 1269, 1609], ['E', 1633, 1913]];
const notice = NOTICE_BOX.map(([ch, x0, x1]) => ({ ch, e: glyph($('noticeText'), 'lg', ch), M: fitCap(LG, ch, x0, x1, 23.5, 1073.5) }));
notice.forEach(L => L.e.setAttribute('transform', mstr(L.M)));
const NOTICE_OP = [
  steps([[0, 0], [8.521, 1]]), mono([[8.562, 0], [8.583, 0.72], [8.625, 1]]), steps([[0, 0], [8.646, 1]]),
  steps([[0, 0], [8.687, 1]]), mono([[8.729, 0], [8.75, 0.78], [8.792, 1]]), steps([[0, 0], [8.812, 1]])
];
const noticeRings = notice.map(L => polyPts(LG, POLY_LG, L.ch, L.M));
const noticePaths = notice.map(() => el('path', {}, $('noticePoly')));   // one path per letter: overlaps add up
const WARP0 = 8.958;
/* the letters tighten around the T (slide sampled on the stems), then bulge */
const N_P = mono([[8.958, 0], [9.0, 0.034], [9.042, 0.063], [9.083, 0.101], [9.125, 0.15], [9.167, 0.285], [9.208, 0.391], [9.25, 0.531], [9.292, 0.763], [9.333, 0.899],
  [9.375, 0.957], [9.417, 0.99], [9.458, 1]]);
const N_SHIFT = [106, 77.7, 7, -61.5, -97.3, -124], N_W = [1, 0.955, 0.93, 0.93, 0.94, 0.98];
/* envelope: the word gradually takes the almond's shape (0 = straight, 1 = almond height at each x) */
const ENVELOPE = mono([[9.083, 0], [9.125, 0.06], [9.167, 0.11], [9.208, 0.16], [9.25, 0.3], [9.292, 0.6], [9.333, 0.85], [9.417, 1]]);
/* the almond arrives slightly too large, settles on the eye from the start, then closes */
const ALM_A = mono([[9.229, 1.33], [9.25, 1.25], [9.292, 1.13], [9.333, 1.04], [9.375, 1.015], [9.417, 1]]);
const ALM_H = mono([[9.417, 512], [9.458, 497], [9.5, 469], [9.542, 405], [9.583, 225], [9.625, 64.5], [9.667, 26.5], [9.708, 9], [9.75, 0]]);
function sceneH(t) {
  const warp = t >= WARP0;
  show($('noticeText'), !warp);
  notice.forEach((L, i) => { const op = NOTICE_OP[i](t); show(L.e, op > 0.004); L.e.setAttribute('fill-opacity', op.toFixed(3)); });
  const almondOn = t >= 9.229;
  show($('almondRim'), almondOn);
  let A = 1, H = 0;
  if (almondOn) {
    A = ALM_A(t); H = t < 9.417 ? 512 * A : ALM_H(t);
    const W = 960 * A;
    $('almondClipPath').setAttribute('d', almond(960, 545, W, H, H));
    $('almondRim').setAttribute('d', almond(960, 545, W, Math.max(0, H - 3), Math.max(0, H - 3)));
  }
  const k = ENVELOPE(t), Hc = t < 9.417 ? 512 * ALM_A(t) : ALM_H(t), sy = lerp(1, Math.min(1, Hc / 525), k), We = 960 * ALM_A(t);
  show($('noticePoly'), warp && sy > 0.002);
  if (!warp || sy <= 0.002) return;
  const P = N_P(t), cy = 546.5;
  noticeRings.forEach((letter, i) => {
    const c = (NOTICE_BOX[i][1] + NOTICE_BOX[i][2]) / 2, dx = N_SHIFT[i] * P, w = lerp(1, N_W[i], P);
    noticePaths[i].setAttribute('d', ringsToD(letter.map(ring => ring.map(([x, y]) => {
      const X = c + dx + (x - c) * w, u = Math.min(1, Math.abs(X - 960) / We);
      return [X, cy + (y - cy) * sy * (1 - k * Math.pow(u, 2.1))];
    }))));
  });
  const poly = $('noticePoly');
  if (almondOn) poly.setAttribute('clip-path', 'url(#almondClip)'); else poly.removeAttribute('clip-path');
}

/* ================= GLOBAL RENDER ================= */
const DUR = 10;
const SCENES = [
  ['sA', 0, 1.75, sceneA], ['sB', 1.75, 2.625, sceneB], ['sC', 2.625, 4.354, sceneC], ['sD', 4.333, 5.354, sceneD],
  ['sE', 5.333, 7.042, sceneE], ['sF', 6.875, 7.646, sceneF], ['sG', 7.583, 8.646, sceneG], ['sH', 8.521, 10.01, sceneH]
];
function render(t) {
  t = clamp(t, 0, DUR);
  for (const [id, a, b, fn] of SCENES) { const on = t >= a && t < b; show($(id), on); if (on) fn(t); }
  // the circles go under the light as soon as it appears; the final dot stays visible to the end
}

/* ---------- GSAP clock ---------- */
const clock = { t: 0 };
const tl = gsap.timeline({ repeat: -1, paused: true });
tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => render(clock.t) });
window.anim = {
  tl, duration: DUR,
  seek(t) { t = clamp(t, 0, DUR); tl.pause(); tl.time(t, true); render(t); },
  play(from = 0) { tl.restart(); tl.time(from); tl.play(); },
  pause() { tl.pause(); }
};
const qs = new URLSearchParams(location.search);
render(0);
Promise.all([document.fonts.load('800 100px "Figtree"', 'LOKSE.'), document.fonts.load('400 100px "League Gothic"', 'CLOSERNTI'), document.fonts.ready]).then(() => {
  buildMorphs();
  if (qs.has('t')) anim.seek(parseFloat(qs.get('t')));
  else if (!qs.has('external')) tl.play(0);
  document.documentElement.dataset.ready = '1';
});
})();
</script>
