  ['M', [567, 755, 365, 532], C.lilac], ['I', [778, 831, 365, 532], C.green], ['L', [856, 980, 365, 532], C.lilac], ['A', [986, 1141, 365, 532], C.red],
  ['D', [566, 712, 547, 720], C.red], ['R', [728, 861, 547, 720], C.lilac], ['A', [871, 1026, 547, 720], C.green], ['W', [1022, 1217, 547, 720], C.lilac], ['S', [1223, 1355, 545, 722], C.green]
];
const TSW = 15;
const titleEls = TITLE.map(([ch, box, col]) => { const g = el('g', {}, $('title')); return { g, t: glyph(g, ch, col, TSW), ch, box }; });
const LOGO = [['M', [50, 79, 43, 73], C.lilac], ['I', [83, 92, 43, 73], C.green], ['L', [97, 117, 43, 73], C.lilac], ['A', [119, 147, 43, 73], C.red]];
const logoEls = LOGO.map(([ch, box, col]) => ({ t: glyph($('logo'), ch, col, 2.5), ch, box }));
function layoutText() {

/* ================= TIMELINE (sampled from the video, 24 fps) =================
   0 – 1.3 s   still home page, the cursor rests in the widget
   1.3 – 2.7   the cursor crosses the page to the cherry
   2.5 – 3.2   hover then grab the cherry
   3.2 – 4.5   drag: trail of small stickers, the others wobble
   4.5 – 6.8   hover the cat, hand, click
   6.8 – 7.5   the cat unfolds into a card that flies to the top left
   7.3 – 8.3   the five other cards appear one by one
   8.8 – 11    hover card 2: she waves, "HI!" bubble
   11 – 12.8   shake, the grid falls, each sticker returns to its spot
   14 – 14.5   the cursor goes back into the widget: frame identical to 0 s           */
const DUR = 15;
const CUR = [[0.55, 1818, 1000], [1.30, 1812, 992], [1.417, 1695, 923], [1.5, 1538, 860], [1.583, 1395, 802], [1.667, 1200, 730], [1.75, 1036, 658], [1.833, 856, 588], [1.917, 725, 534],
  [2.0, 629, 495], [2.083, 557, 464], [2.167, 483, 428], [2.25, 449, 412], [2.333, 423, 400], [2.417, 404, 388], [2.5, 392, 379], [2.583, 385, 373], [2.667, 383, 371],
  [3.083, 383, 371], [3.167, 386, 373], [3.25, 401, 395], [3.333, 426, 431], [3.417, 463, 492], [3.5, 511, 571], [3.583, 562, 664], [3.667, 622, 762], [3.75, 682, 846],
  [3.833, 741, 910], [3.917, 801, 970], [4.0, 862, 1016], [4.083, 929, 1052], [4.167, 1011, 1072], [4.25, 1095, 1088], [4.333, 1160, 1086], [4.417, 1211, 1066],
  [4.5, 1284, 1041], [4.583, 1353, 1020], [4.667, 1416, 993], [4.75, 1472, 966], [4.833, 1519, 943], [4.917, 1559, 922], [5.0, 1589, 907], [5.083, 1614, 894],
  [5.167, 1637, 882], [5.25, 1644, 877], [5.333, 1646, 876], [5.917, 1646, 876], [6.0, 1640, 850], [6.083, 1634, 820], [6.167, 1631, 806], [6.25, 1631, 803],
  [6.75, 1631, 803], [6.833, 1629, 807], [7.833, 1629, 808], [7.917, 1616, 801], [8.0, 1552, 768], [8.083, 1447, 718], [8.167, 1298, 652], [8.25, 1224, 620],
  [8.333, 1165, 586], [8.417, 1120, 563], [8.5, 1088, 546], [8.583, 1063, 535], [8.667, 1046, 526], [8.75, 1038, 521], [8.833, 1036, 519], [8.917, 1035, 518],
  [13.95, 1035, 518], [14.0, 1061, 538], [14.083, 1184, 612], [14.167, 1394, 740], [14.25, 1505, 812], [14.333, 1600, 870], [14.42, 1720, 950], [14.5, 1800, 990], [14.62, 1818, 1000]];
const CX = mono(CUR.map(p => [p[0], p[1]])), CY = mono(CUR.map(p => [p[0], p[2]]));

/* card 1: from the full-screen cat (x1/0.9) to its spot in the grid */
const K1X = mono([[6.84, 1545.8], [6.92, 1470], [7.0, 1207], [7.08, 790], [7.16, 570], [7.25, 480], [7.38, 417], [7.5, 398], [7.6, 396.5]]);
const K1Y = mono([[6.84, 840.2], [6.92, 832], [7.0, 737], [7.08, 555], [7.16, 471], [7.25, 438], [7.38, 408], [7.5, 396], [7.6, 394.5]]);
const K1S = mono([[6.84, 1 / 0.9], [6.92, 1.065], [7.0, 1.028], [7.08, 1.005], [7.16, 1.0], [7.6, 1.0]]);
const CARDS = [
  { id: 'card1', cx: 396.5, cy: 394.5 }, { id: 'card2', cx: 956.5, cy: 440, t: 7.36 }, { id: 'card3', cx: 1517.5, cy: 394.5, t: 7.55 },
  { id: 'card4', cx: 396.5, cy: 819, t: 7.72 }, { id: 'card5', cx: 956.5, cy: 864.5, t: 7.9 }, { id: 'card6', cx: 1517.5, cy: 819, t: 8.06 }
].map(c => Object.assign(c, { e: $(c.id) }));
/* the grid falls after the shake */
const DROP = mono([[11.15, 0], [11.25, 8], [11.34, 20], [11.42, 45], [11.5, 72], [11.59, 150], [11.67, 300], [11.75, 523], [11.84, 793], [11.92, 1100], [11.96, 1200]]);

/* each sticker returns to its spot (staggered start, bounce, exact landing) */
const RET = {
  pcloud: { t: 11.72, d: 0.62, dx: 160, dy: 360, s: 0.55, r: 0, cx: 838, cy: 184 },
  cherry: { t: 11.76, d: 0.66, dx: 40, dy: 190, s: 0.8, r: 18, cx: 271, cy: 395 },
  star: { t: 11.84, d: 0.66, dx: -60, dy: 380, s: 0.7, r: -40, cx: 1621, cy: 430 },
  ccloud: { t: 11.86, d: 0.6, dx: 0, dy: 170, s: 0.8, r: 0, cx: 1313, cy: 208 },
  bcloud: { t: 11.92, d: 0.7, dx: -140, dy: 240, s: 0.85, r: -8, cx: 330, cy: 880 },
  cat: { t: 11.98, d: 0.72, dx: 160, dy: 300, s: 0.85, r: 10, cx: 1580, cy: 900 }
};
function ret(t, k) {
  const R = RET[k]; if (t < 11.5 || t >= R.t + R.d) return null;
  const u = clamp((t - R.t) / R.d), p = ease('back.out(1.25)')(u), q = ease('back.out(1.9)')(u);
  return { dx: R.dx * (1 - p), dy: R.dy * (1 - p), s: lerp(R.s, 1, q), r: R.r * (1 - p), o: clamp(u / 0.22) };
}
const EYE_CY = { catEyeL: 846, catEyeR: 868, c3EyeL: 342, c4Eyes: 791 };
function setOpen(g, closed) { // closed: 0..1
  const o = g.querySelector('.open'), s = g.querySelector('.shut');
  if (o) { const cy = EYE_CY[g.id]; o.setAttribute('transform', `translate(0 ${cy}) scale(1 ${Math.max(0.08, 1 - closed).toFixed(3)}) translate(0 ${-cy})`); o.setAttribute('opacity', closed > 0.85 ? 0 : 1); }
  if (s) s.setAttribute('opacity', closed > 0.85 ? 1 : 0);
}
function squash(g, f, cx, cy) { // f: 0..1 -> eyelids (squinting eyes)
  g.setAttribute('transform', `translate(0 ${cy}) scale(1 ${Math.max(0.1, 1 - 0.9 * f).toFixed(3)}) translate(0 ${-cy})`);
}

/* ================= RENDER ================= */
function render(t) {
  t = clamp(t, 0, DUR);
  const inGrid = t >= 6.86 && t < 11.96;
  const homeOn = t < 6.98 || t >= 11.5;
  show($('home'), homeOn); show($('grid'), inGrid);

  /* ---- navigation: home style / grid style ---- */
  const gridStyle = t >= 6.96 && t < 11.62;
  $('cta').setAttribute('fill', gridStyle ? C.green : C.red);
  logoEls[3].t.setAttribute('fill', gridStyle ? C.green : C.red); logoEls[3].t.setAttribute('stroke', gridStyle ? C.green : C.red);
  $('avHome').setAttribute('opacity', gridStyle ? 0 : 1); $('avGrid').setAttribute('opacity', gridStyle ? 1 : 0);

  if (homeOn) renderHome(t);
  if (inGrid) renderGrid(t);

  /* ---- status bar (hovering the cat link) ---- */
  $('status').setAttribute('opacity', hold(t, 6.3, 7.45, 0.06).toFixed(3));

  /* ---- cursor ---- */
  const vis = t > 0.55 && t < 14.66;
  const cur = $('cursor');
  if (!vis) { cur.setAttribute('opacity', 0); }
  else {
    const a = Math.min(clamp((t - 0.55) / 0.14), clamp((14.66 - t) / 0.14));
    let x = CX(t), y = CY(t);
    const sh = shake(t); x += sh.x * 0.8;
    const press = Math.max(blink(t, 3.0, 0.2), blink(t, 6.68, 0.14));
    const s = (0.45 + 0.55 * a) * (1 - 0.12 * press);
    cur.setAttribute('opacity', a.toFixed(3));
    cur.setAttribute('transform', `translate(${f2(x)} ${f2(y)}) scale(${s.toFixed(3)})`);
    const hand = t >= 5.96 && t < 6.79;
    show($('hand'), hand); show($('arrow'), !hand);
  }
}

function shake(t) {
  if (t <= 10.95 || t >= 11.5) return { x: 0, r: 0 };
  const u = (t - 10.95) / 0.55, env = Math.sin(Math.PI * u), w = 2 * Math.PI * 6.5 * (t - 10.95);
  return { x: 15 * Math.sin(w) * env, r: 0.7 * Math.sin(w + 1.1) * env };
}

function renderHome(t) {
  const fadeOut = t < 6.98 ? 1 - prog(t, 6.86, 6.96, 'power1.in') : 1;
  $('home').setAttribute('opacity', fadeOut.toFixed(3));

  /* sparkles */
  sparkEls.forEach((e, i) => {
    let s = 1, o = 1;
    if (t >= 11.5 && t < 12.2) { const u = clamp((t - 11.62 - 0.05 * i) / 0.32); s = ease('back.out(2.2)')(u); o = clamp(u / 0.3); }
    s *= 1 + 0.12 * blink(t, 2.1 + i * 1.3, 0.5);
    const [x, y] = SPARKS[i];
    tf(e, 0, 0, 0, Math.max(0.001, s), Math.max(0.001, s), x, y); e.setAttribute('opacity', o.toFixed(3));
  });

  /* lilac cloud: winks when the cursor passes */
  { let dx = 0, dy = 0, r = 0, s = 1, o = 1; const R = ret(t, 'pcloud'); if (R) ({ dx, dy, s, r, o } = R);
    r += wob(t, 1.95, 0.7, 1.6, 2.2);
    tf($('pcloud'), dx, dy, r, s, s, 838, 300); $('pcloud').setAttribute('opacity', o.toFixed(3));
    squash($('pcloudEyes'), Math.max(blink(t, 2.15, 0.2), blink(t, 6.0, 0.2)), 0, 172); }
  /* small cream cloud */
  { let dx = 0, dy = 0, r = 0, s = 1, o = 1; const R = ret(t, 'ccloud'); if (R) ({ dx, dy, s, r, o } = R);
    tf($('ccloud'), dx, dy, r, s, s, 1313, 300); $('ccloud').setAttribute('opacity', o.toFixed(3));
    squash($('ccloudEyes'), Math.max(blink(t, 4.9, 0.24), blink(t, 0.9, 0.2)), 0, 200); }
  /* cherry: hover, grab, release */
  { let dx = 0, dy = 0, r = 0, s = 1, o = 1; const R = ret(t, 'cherry'); if (R) ({ dx, dy, s, r, o } = R);
    const lift = t < 3.2 ? prog(t, 2.45, 2.75, 'power2.out') : 1 - prog(t, 3.2, 3.36, 'power2.in');
    const press = blink(t, 3.0, 0.2);
    s *= 1 + 0.035 * lift - 0.03 * press; dy += -7 * lift; r += -3 * lift + wob(t, 3.2, 0.75, 4, 2.6);
    tf($('cherry'), dx, dy, r, s, s, 271, 395); $('cherry').setAttribute('opacity', o.toFixed(3)); }
  /* star: wink */
  { let dx = 0, dy = 0, r = 0, s = 1, o = 1; const R = ret(t, 'star'); if (R) ({ dx, dy, s, r, o } = R);
    r += wob(t, 4.45, 0.9, 2.2, 1.8);
    tf($('star'), dx, dy, r, s, s, 1621, 430); $('star').setAttribute('opacity', o.toFixed(3));
    squash($('starEyes'), blink(t, 4.72, 0.28), 0, 421); }
  /* big cloud: it sways when the trail passes */
  { let dx = 0, dy = 0, r = 0, s = 1, o = 1; const R = ret(t, 'bcloud'); if (R) ({ dx, dy, s, r, o } = R);
    r += wob(t, 3.62, 0.85, 2.4, 2.2); const sq = wob(t, 3.62, 0.85, 0.03, 2.2);
    tf($('bcloud'), dx, dy, r, s * (1 + sq), s * (1 - sq), 330, 1018); $('bcloud').setAttribute('opacity', o.toFixed(3));
    squash($('bcloudEyes'), blink(t, 3.72, 0.26), 0, 846); }
  /* cat: it purrs (eye closed), lifts on hover, unfolds on click */
  { let dx = 0, dy = 0, r = 0, s = 1, o = 1; const R = ret(t, 'cat'); if (R) ({ dx, dy, s, r, o } = R);
    r += wob(t, 4.55, 0.85, 2.2, 2.0) + wob(t, 3.5, 0.6, 1.0, 2.4);
    const lift = t < 6.7 ? prog(t, 5.98, 6.2, 'power2.out') : 1 - prog(t, 6.7, 6.77, 'power2.in');
    s *= 1 + 0.02 * lift; dy += -6 * lift;
    tf($('cat'), dx, dy, r, s, s, 1580, 960);
    $('cat').setAttribute('opacity', o.toFixed(3));
    show($('cat'), t < 6.86 || t >= 11.5);
    $('catBack').setAttribute('opacity', (t < 11.5 ? 1 - prog(t, 6.74, 6.84, 'none') : 1).toFixed(3));
    setOpen($('catEyeL'), hold(t, 3.55, 6.32, 0.07));
    setOpen($('catEyeR'), Math.max(hold(t, 3.55, 4.62, 0.07), blink(t, 5.45, 0.2)));
  }
  /* card born behind the cat */
  { const k = t >= 6.74 && t < 6.98 ? prog(t, 6.74, 6.86, 'power2.out') : 0;
    $('reveal').setAttribute('opacity', k > 0 ? 1 : 0);
    if (k > 0) tf($('reveal'), 0, 0, 0, 0.3 + 0.7 * k, 0.3 + 0.7 * k, 1600, 900); }

  /* title: bounces as the cursor passes, zooms back */
  { let ts = 1, to = 1;
    if (t >= 11.5 && t < 12.1) { to = prog(t, 11.66, 11.8, 'power1.out'); ts = lerp(0.86, 1, ease('back.out(1.6)')(clamp((t - 11.66) / 0.36))); }
    $('title').setAttribute('opacity', to.toFixed(3)); tf($('title'), 0, 0, 0, ts, ts, 960, 543);
    titleEls.forEach((L, i) => {
      const hit = i === 0 ? 1.93 : i === 4 ? 3.45 : i === 5 ? 3.55 : -1;
      const q = hit > 0 ? wob(t, hit, 0.55, 0.07, 2.6) : 0;
      const base = L.box[3];
      tf(L.g, 0, 0, 0, 1 + q * 0.6, 1 - q, (L.box[0] + L.box[1]) / 2, base);
    });
  }
  /* text bars, button and magnifier */
  { const back = t >= 11.5 ? prog(t, 12.02, 12.32, 'power2.out') : 1;
    $('bars').setAttribute('opacity', back.toFixed(3)); $('bars').setAttribute('transform', `translate(0 ${f2(14 * (1 - back))})`);
    let bo = t < 11.5 ? 1 - prog(t, 3.95, 4.18, 'power2.in') : prog(t, 12.1, 12.38, 'power2.out');
    const bs = t < 11.5 ? 1 - 0.12 * prog(t, 3.95, 4.18, 'power2.in') : lerp(0.85, 1, ease('back.out(2)')(clamp((t - 12.1) / 0.3)));
    for (const id of ['btn', 'search']) { $(id).setAttribute('opacity', bo.toFixed(3)); tf($(id), 0, 0, 0, bs, bs, id === 'btn' ? 830 : 977, 982); }
  }

  /* trail: each small sticker is born under the cursor then flies to its spot */
  { const trailOn = t >= 3.2 && t < 6.98;
    show($('trail'), trailOn);
    if (trailOn) {
      const dragPos = tt => [CX(tt) - 8, CY(tt) - 10];
      TRAIL.forEach((S, i) => {
        if (t < S.t) { show(S.g, false); return; }
        show(S.g, true);
        const u = clamp((t - S.t) / 0.42), p = ease('power3.out')(u), q = ease('back.out(2.2)')(u);
        const [sx, sy] = dragPos(S.t);
        const x = lerp(sx, S.x, p), y = lerp(sy, S.y, p), s = lerp(0.3, 1, q), r = lerp(i % 2 ? 25 : -25, S.r, p);
        S.g.setAttribute('transform', `translate(${f2(x)} ${f2(y)}) rotate(${f2(r)}) scale(${s.toFixed(4)})`);
      });
      /* the pulled sticker: comes out of the cherry, follows the cursor, then is dropped */
      let x, y, s, r;
      const pop = ease('back.out(2.4)')(clamp((t - 3.2) / 0.22));
      if (t < 4.1) { [x, y] = dragPos(t); s = pop; r = 8 * Math.sin((t - 3.2) * 9); }
      else { const u = clamp((t - 4.1) / 0.45), p = ease('power3.out')(u), [x0, y0] = dragPos(4.1);
        x = lerp(x0, 1162, p); y = lerp(y0, 1032, p); s = 1 + 0.12 * Math.sin(Math.PI * u) * (1 - u); r = lerp(8 * Math.sin(0.9 * 9), 12, p); }
      DRAG.g.setAttribute('transform', `translate(${f2(x)} ${f2(y)}) rotate(${f2(r)}) scale(${Math.max(0.001, s).toFixed(4)})`);
    }
  }
}

function renderGrid(t) {
  const sh = shake(t), drop = t >= 11.15 ? DROP(t) : 0;
  $('grid').setAttribute('transform', `translate(${f2(sh.x)} ${f2(drop)}) rotate(${f2(sh.r)} 960 600)`);
  CARDS.forEach((c, i) => {
    if (i === 0) {
      const cx = K1X(t), cy = K1Y(t), s = K1S(t);
      c.e.setAttribute('transform', `translate(${f2(cx)} ${f2(cy)}) scale(${s.toFixed(5)}) translate(${-c.cx} ${-c.cy})`);
      return;
    }
    const u = clamp((t - c.t) / 0.34);
    if (u <= 0) { show(c.e, false); return; }
    show(c.e, true);
    let s = lerp(0.55, 1, ease('back.out(1.7)')(u)), ty = 26 * (1 - ease('power3.out')(u));
    if (i === 1) { const h = prog(t, 8.76, 8.96, 'power2.out'); s *= 1 + 0.018 * h; ty -= 4 * h; }
    c.e.setAttribute('opacity', clamp(u / 0.35).toFixed(3));
    tf(c.e, 0, ty, 0, s, s, c.cx, c.cy);
  });
  /* card 2: the character raises a hand and waves */
  { const a = prog(t, 8.82, 9.04, 'back.out(1.3)');
    const wave = t > 9.0 ? 10 * Math.sin(2 * Math.PI * 2.1 * (t - 9.0)) * clamp((t - 9.0) / 0.15) : 0;
    $('arm2').setAttribute('transform', `rotate(${f2((1 - a) * 150 + wave)} 1055 640)`);
    const hi = clamp((t - 8.98) / 0.26), hs = ease('back.out(2.4)')(hi);
    $('hi2').setAttribute('opacity', hi > 0 ? 1 : 0);
    tf($('hi2'), 0, 0, 0, Math.max(0.001, hs), Math.max(0.001, hs), 1022, 360);
    const ln = prog(t, 9.0, 9.12, 'power1.out'), pulse = 1 + 0.08 * Math.sin(2 * Math.PI * 2.1 * (t - 9.0));
    $('lines2').setAttribute('opacity', ln.toFixed(3)); tf($('lines2'), 0, 0, 0, ln > 0 ? pulse : 1, ln > 0 ? pulse : 1, 785, 390);
  }
  /* card 3: wink; card 4: she opens her eyes, the sparkle grows */
  setOpen($('c3EyeL'), prog(t, 8.98, 9.06, 'none'));
  setOpen($('c4Eyes'), 1 - prog(t, 9.0, 9.08, 'none'));
  { const g = ease('back.out(2)')(clamp((t - 8.86) / 0.3)), s = lerp(0.55, 1, g) * (1 + 0.05 * Math.sin(2 * Math.PI * 1.6 * Math.max(0, t - 9.2)));
    tf($('spark4s'), 0, 0, 0, s, s, 579, 722); $('rays4').setAttribute('opacity', prog(t, 9.0, 9.2, 'power1.out').toFixed(3)); }
  for (const [id, x, y, ph] of [['spark3', 1277, 500, 0], ['spark5', 1141, 890, 1.3], ['spark6', 1537, 700, 2.1]]) {
    const s = 1 + 0.12 * Math.sin(2 * Math.PI * 1.2 * (t - 7) + ph); tf($(id), 0, 0, 0, s, s, x, y);
  }
  /* card 1: the cat winks */
  setOpen($('catEyeL'), Math.max(blink(t, 9.6, 0.18), blink(t, 10.7, 0.18)));
  setOpen($('catEyeR'), Math.max(blink(t, 9.6, 0.18), blink(t, 10.7, 0.18)));
}

/* ---------- GSAP clock ---------- */
const clock = { t: 0 };
const tl = gsap.timeline({ repeat: -1, paused: true });
tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => render(clock.t) });
window.anim = {
  tl, duration: DUR,
  seek(t) { t = clamp(t, 0, DUR); tl.pause(); tl.time(t, true); render(t); },
  play(from = 0) { tl.restart(); tl.time(from); tl.play(); },
  pause() { tl.pause(); }
};
const qs = new URLSearchParams(location.search);
render(0);
Promise.all([document.fonts.load('900 100px "Nunito"', 'MILADRWSH!'), document.fonts.ready]).then(() => {
  layoutText();
  render(0);
  if (qs.has('t')) anim.seek(parseFloat(qs.get('t')));
  else if (!qs.has('external')) tl.play(0);
  document.documentElement.dataset.ready = '1';
});
})();
