<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MILA DRAWS</title>
<meta name="description" content="Mila draws flat stickers, cats, clouds and cheerful characters.">
<meta name="theme-color" content="#EEE8EF">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=block&text=MILADRWSH!" rel="stylesheet">
<style>
  :root{
    --bg:#EEE8EF; --lilac:#B983BE; --lilac-d:#9B6CA6; --green:#178B44; --green-d:#127A3B; --red:#D1242F;
    --cream:#EAE1C2; --cream2:#F3ECDD; --pill:#F7EEEA; --white:#FDFBFC; --ink:#073F31; --grey:#A79DAD; --line:#DDD0DF;
    --u:1;
  }
  *{box-sizing:border-box}
  html{background:var(--bg);-webkit-text-size-adjust:100%}
  html.lb-open{overflow:hidden}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  a{color:inherit;-webkit-tap-highlight-color:transparent}
  svg{display:block}
  .sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  :focus{outline:none}
  :focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .defs{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
  text{font-family:'Nunito',sans-serif;font-weight:900;text-rendering:geometricPrecision}
  .bar{display:block;border-radius:999px;background:var(--lilac)}

  /* ================= NAVIGATION ================= */
  .nav{position:fixed;top:0;left:0;right:0;z-index:50;height:calc(115px*var(--u));display:flex;align-items:center;
    padding:0 calc(49px*var(--u)) 0 calc(46px*var(--u));pointer-events:none;background:rgba(238,232,239,0);transition:background-color .25s}
  body.scrolled .nav{background:var(--bg)}
  .nav > *{pointer-events:auto}
  .logo{display:block;width:calc(106px*var(--u));height:calc(38px*var(--u));border-radius:8px;text-decoration:none}
  .logo svg{width:100%;height:100%}
  .logoA{transition:fill .25s,stroke .25s}
  body.in-work .nav .logoA{fill:var(--green);stroke:var(--green)}
  .links{margin-left:auto}
  .links ul{display:flex;align-items:center;gap:calc(50px*var(--u));list-style:none;margin:0;padding:0}
  .links li{position:relative}
  .nl{display:flex;align-items:center;height:calc(64px*var(--u));border-radius:8px}
  .nl .bar{width:calc(var(--bw)*1px*var(--u));height:calc(12px*var(--u));transition:background-color .2s,transform .2s}
  .nl:hover .bar,.nl[aria-expanded="true"] .bar{background:var(--green);transform:translateY(-2px)}
  .chev{width:calc(18px*var(--u));height:calc(12px*var(--u));margin-left:calc(6px*var(--u));transition:transform .25s}
  .nl[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .avatar{display:block;width:calc(56px*var(--u));height:calc(56px*var(--u));margin-left:calc(51px*var(--u));border-radius:50%;transition:transform .2s}
  .avatar:hover{transform:scale(1.08) rotate(-6deg)}
  .avatar svg{width:100%;height:100%}
  .avGrid{opacity:0;transition:opacity .25s}.avHome{transition:opacity .25s}
  body.in-work .avGrid{opacity:1} body.in-work .avHome{opacity:0}
  .cta{display:grid;place-items:center;width:calc(163px*var(--u));height:calc(65px*var(--u));margin-left:calc(25px*var(--u));border-radius:999px;background:var(--red);transition:background-color .25s,transform .15s}
  .cta .bar{width:calc(96px*var(--u));height:calc(11px*var(--u));background:var(--pill)}
  .cta:hover{background:#B91E28} body.in-work .cta{background:var(--green)} body.in-work .cta:hover{background:var(--green-d)}
  .cta:active,.pill:active,.see:active,.top-btn:active,.w-chat:active,.w-shake:active,.mi:active{transform:scale(.93)}
  .burger{display:none}
  .more-menu{position:absolute;top:calc(100% + 8px*var(--u));right:calc(-24px*var(--u));min-width:calc(280px*var(--u));background:var(--white);border-radius:calc(26px*var(--u));padding:calc(12px*var(--u));display:grid;gap:calc(4px*var(--u))}
  .more-menu[hidden]{display:none}
  .mi{display:flex;align-items:center;gap:calc(16px*var(--u));height:calc(60px*var(--u));padding:0 calc(14px*var(--u));border-radius:calc(18px*var(--u));width:100%;transition:background-color .15s,transform .15s}
  .mi:hover,.mi:focus-visible{background:var(--bg)}
  .mi .ic{flex:none;display:grid;place-items:center;width:calc(40px*var(--u));height:calc(40px*var(--u));border-radius:50%}
  .mi .ic svg{width:60%;height:60%}
  .mi .bar{height:calc(11px*var(--u));width:calc(var(--bw)*1px*var(--u))}

  /* ================= HERO (stickers) ================= */
  .hero{position:relative;height:100vh;height:100svh;min-height:460px;overflow:hidden}
  .shaker{position:absolute;inset:0}
  .stage{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-select:none}
  .item{position:absolute;display:block}
  .l{position:absolute;inset:0;display:block;pointer-events:none}
  .item svg{width:100%;height:100%;overflow:visible}
  .sticker{pointer-events:none;touch-action:none;-webkit-user-drag:none;border-radius:40px}
  .sticker svg{pointer-events:none}
  .sticker use{pointer-events:visiblePainted;cursor:grab}
  .sticker:focus-visible{outline:none}
  .sticker:focus-visible .wob{outline:6px dashed var(--ink);outline-offset:4px;border-radius:40px}
  body.dragging,body.dragging *{cursor:grabbing!important}
  .glyph{pointer-events:visiblePainted}
  .trail{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:30}
  .title{margin:0;width:100%;height:100%}
  .copy{position:absolute;inset:0}
  .copy .bars{position:absolute;inset:0;width:100%;height:100%}
  .see{position:absolute;left:0;top:72.53%;width:43.64%;height:27.47%;border-radius:999px;background:var(--green);pointer-events:auto;transition:background-color .2s}
  .see:hover{background:var(--green-d)}
  .see .bar{position:absolute;left:20.1%;top:42.19%;width:59.8%;height:15.63%;background:var(--cream2)}
  .see:focus-visible,.search:focus-visible{outline:calc(4px*var(--cs,1)) solid var(--ink);outline-offset:calc(4px*var(--cs,1))}
  .search{position:absolute;left:47.81%;top:73.82%;width:12.28%;height:24.03%;border-radius:50%;pointer-events:auto;z-index:2}
  .search:hover circle:first-child{stroke:#8E8296}
  .search svg{width:100%;height:100%}
  .search-field{position:absolute;left:47.81%;top:73.82%;width:12.28%;height:24.03%;border-radius:999px;border:calc(2.5px*var(--cs,1)) solid var(--grey);background:rgba(253,251,252,0);visibility:hidden;overflow:hidden;pointer-events:auto}
  .search-field input{position:absolute;top:0;bottom:0;left:calc(58px*var(--cs,1));right:calc(18px*var(--cs,1));width:auto;border:0;background:transparent;color:var(--ink);
    font:800 calc(22px*var(--cs,1))/1 system-ui,-apple-system,sans-serif;outline:none;padding:0;-webkit-appearance:none;appearance:none}
  .search-field input::-webkit-search-cancel-button{display:none}
  .search-field input{user-select:text;-webkit-user-select:text}
  section[tabindex]:focus,.about-actions:focus{outline:none}

  /* ================= WORK (illustration grid) ================= */
  .work{position:relative;height:100vh;height:100svh;min-height:460px;overflow:hidden}
  .work-inner{position:absolute;inset:0}
  .work-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
  .card{position:absolute;left:calc(var(--x)*1px);top:calc(var(--y)*1px);width:calc(var(--w)*1px);height:calc(var(--h)*1px)}
  .card__inner{position:absolute;inset:0}
  .card__btn{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:28px}
  .card__btn svg{width:100%;height:100%}
  .card__btn:focus-visible{outline:6px solid var(--ink);outline-offset:6px}
  .card.is-flying .card__btn{visibility:hidden}

  /* ================= ABOUT ================= */
  .about{position:relative}
  .about-grid{position:relative;max-width:1700px;margin:0 auto;padding:clamp(90px,9vw,170px) clamp(16px,5.7vw,110px) clamp(60px,6vw,110px);
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,5vw,96px);align-items:center}
  .about-card{width:100%;max-width:620px;justify-self:end;aspect-ratio:1/1;border-radius:28px;position:relative}
  .about-card svg{width:100%;height:100%}
  .about-copy{max-width:660px}
  .about-bars{width:100%;height:auto}
  .chips{display:flex;flex-wrap:wrap;gap:14px;list-style:none;margin:clamp(24px,3vw,44px) 0 0;padding:0}
  .chip{display:flex;align-items:center;gap:12px;height:52px;padding:0 22px 0 14px;border-radius:999px;background:var(--white)}
  .chip i{display:block;width:26px;height:26px;border-radius:50%}
  .chip .bar{height:10px;width:var(--bw)}
  .about-actions{display:flex;flex-wrap:wrap;gap:16px;margin-top:clamp(28px,3.4vw,52px)}
  .pill{display:grid;place-items:center;width:199px;height:64px;border-radius:999px;transition:background-color .2s}
  .pill .bar{width:60%;height:10px;background:var(--cream2)}
  .pill--red{background:var(--red)} .pill--red:hover{background:#B91E28}
  .pill--green{background:var(--green)} .pill--green:hover{background:var(--green-d)}
  .deco{position:absolute;pointer-events:auto}
  .deco svg{width:100%;height:100%;overflow:visible}
  #decoStar{right:3%;top:16%;width:clamp(70px,8vw,150px);aspect-ratio:530/513}
  #decoCherry{left:2%;bottom:6%;width:clamp(60px,6.5vw,120px);aspect-ratio:482/544}
  #decoCloud{right:12%;bottom:6%;width:clamp(90px,10vw,190px);aspect-ratio:470/253}
  .foot{width:calc(100% - 2 * clamp(16px,5.7vw,110px));max-width:1480px;margin:0 auto;padding:28px 0 140px;display:flex;align-items:center;gap:clamp(18px,3vw,50px);border-top:3px solid var(--line)}
  .foot .logo{width:106px;height:38px;--u:1}
  .foot-bars{display:flex;gap:28px;margin-left:auto}
  .foot-bars .bar{height:10px;width:var(--bw)}
  .top-btn{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--green);transition:background-color .2s,transform .15s}
  .top-btn:hover{background:var(--green-d)}
  .top-btn svg{width:22px;height:22px}

  /* ================= FLOATING WIDGET + CONTACT ================= */
  .widget{position:fixed;right:calc(49px*var(--u));bottom:calc(41px*var(--u));width:calc(68px*var(--u));height:calc(68px*var(--u));z-index:60}
  .w-chat{position:absolute;inset:0;border-radius:50%;transition:transform .15s}
  .w-chat:hover{transform:scale(1.06)}
  .w-shake{position:absolute;left:calc(-17px*var(--u));top:calc(-18px*var(--u));width:calc(34px*var(--u));height:calc(34px*var(--u));border-radius:50%;transition:transform .15s}
  .w-shake:hover{transform:rotate(-14deg) scale(1.1)}
  .widget svg{width:100%;height:100%}
  .contact{position:fixed;right:calc(49px*var(--u));bottom:calc(126px*var(--u));width:min(390px,calc(100vw - 32px));background:var(--white);border-radius:28px;padding:22px;z-index:61}
  .contact[hidden]{display:none}
  .contact__head{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding-right:46px}
  .contact__head svg{width:52px;height:52px;flex:none}
  .contact__head .rows{display:grid;gap:9px;flex:1}
  .contact__head .bar{height:10px}
  .contact textarea{display:block;width:100%;min-height:120px;resize:vertical;border:2.5px solid var(--grey);border-radius:20px;background:var(--bg);padding:14px 16px;
    font:700 16px/1.4 system-ui,-apple-system,sans-serif;color:var(--ink)}
  .contact textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .contact__form .pill{margin-top:14px;width:160px;height:54px}
  .contact__close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;transition:transform .15s}
  .contact__close:hover{transform:rotate(90deg)}
  .contact__close svg{width:16px;height:16px}
  .contact__done{display:grid;place-items:center;padding:6px 0 8px}
  .contact__done[hidden]{display:none}
  .contact__done svg{width:220px;height:auto}

  /* ================= LIGHTBOX ================= */
  .lb{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:rgba(238,232,239,.96);overflow:hidden;color:var(--ink)}
  .lb::backdrop{background:transparent}
  .lb__wrap{position:absolute;inset:0;display:grid;place-items:center}
  .lb__stage{position:relative;display:grid;place-items:center}
  .lb__art{width:600px;border-radius:28px}
  .lb__art svg{width:100%;height:auto}
  .lb__btn{position:absolute;display:grid;place-items:center;width:64px;height:64px;border-radius:50%;transition:transform .15s,background-color .2s}
  .lb__btn svg{width:24px;height:24px}
  .lb__btn:hover{transform:scale(1.08)} .lb__btn:active{transform:scale(.92)}
  .lb__close{top:28px;right:28px;background:var(--red)}
  .lb__prev{left:32px;top:50%;margin-top:-32px;background:var(--lilac)}
  .lb__next{right:32px;top:50%;margin-top:-32px;background:var(--green)}
  .lb__dots{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:6px}
  .dot{display:grid;place-items:center;width:32px;height:32px;border-radius:50%}
  .dot span{display:block;width:12px;height:12px;border-radius:50%;background:var(--lilac);transition:transform .2s,background-color .2s}
  .dot[aria-current="true"] span{background:var(--green);transform:scale(1.4)}

  /* ================= COMPACT (phones, portrait tablets) ================= */
  @media not all and (min-width: 900px) and (min-aspect-ratio: 6/5){
    .nav{height:64px;padding:0 14px}
    .logo{width:84px;height:30px}
    .avatar{width:40px;height:40px;margin-left:auto}
    .cta{width:92px;height:40px;margin-left:10px}
    .cta .bar{width:52px;height:8px}
    .burger{display:grid;place-content:center;gap:6px;width:44px;height:44px;margin-left:8px;border-radius:12px}
    .burger span{display:block;width:22px;height:4px;border-radius:2px;background:var(--lilac);transition:transform .25s,opacity .2s}
    .burger[aria-expanded="true"] span:nth-child(1){transform:translateY(10px) rotate(45deg)}
    .burger[aria-expanded="true"] span:nth-child(2){opacity:0}
    .burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-10px) rotate(-45deg)}
    .links{position:fixed;top:64px;left:0;right:0;margin:0;background:var(--bg);padding:8px 22px 26px;display:none;max-height:calc(100svh - 64px);overflow:auto}
    .links.open{display:block}
    .links ul{flex-direction:column;align-items:stretch;gap:0}
    .nl{height:56px;width:100%}
    .nl .bar{height:14px;width:calc(var(--bw)*1.7px)}
    .chev{width:22px;height:14px;margin-left:10px}
    .more-menu{position:static;min-width:0;background:transparent;padding:0 0 6px 10px;gap:0}
    .mi{height:52px;gap:14px;padding:0 10px;border-radius:16px}
    .mi .ic{width:34px;height:34px}
    .mi .bar{height:10px;width:calc(var(--bw)*1.3px)}
    .work{height:auto;min-height:0;padding:84px 16px 40px}
    .work-inner{position:relative;inset:auto}
    .work-stage{position:static;width:auto;height:auto;transform:none!important;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
    .card{position:relative;left:auto;top:auto;width:auto;height:auto;aspect-ratio:var(--w)/var(--h)}
    .card__btn{border-radius:24px}
    .card__btn:focus-visible{outline-width:3px;outline-offset:3px}
    .about-grid{grid-template-columns:1fr;padding:64px 16px 48px;gap:34px}
    .about-card{justify-self:center;max-width:460px}
    #decoStar{right:10px;top:34px;width:74px}
    #decoCherry{left:6px;top:calc(64px + min(100vw - 32px, 460px) - 70px);bottom:auto;width:62px}
    #decoCloud{right:6px;top:calc(64px + min(100vw - 32px, 460px) - 40px);bottom:auto;width:100px}
    .pill{width:160px;height:56px}
    .foot{padding:22px 0 110px}
    .foot-bars{display:none}
    .foot .top-btn{margin-left:auto}
    .widget{right:16px;bottom:16px;width:56px;height:56px}
    .w-shake{left:-14px;top:-14px;width:32px;height:32px}
    .contact{right:16px;left:16px;width:auto;bottom:86px}
    .lb__btn{width:52px;height:52px}
    .lb__close{top:14px;right:14px}
    .lb__prev{left:16px;top:auto;bottom:18px;margin:0}
    .lb__next{right:16px;top:auto;bottom:18px;margin:0}
    .lb__dots{bottom:28px}
    .dot{width:26px;height:26px}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

  <!-- ===== CHERRY ===== -->

<script>
(() => {
'use strict';
gsap.registerPlugin(ScrollTrigger, ScrollToPlugin);
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

const C = { bg: '#EEE8EF', lilac: '#B983BE', green: '#178B44', red: '#D1242F', cream: '#EAE1C2', white: '#FDFBFC' };
const NS = 'http://www.w3.org/2000/svg';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const rand = (a, b) => a + Math.random() * (b - a);
const f2 = v => (Math.abs(v) < 1e-6 ? 0 : v).toFixed(2);

const RM_Q = '(prefers-reduced-motion: reduce)';
const DESK_Q = '(min-width: 900px) and (min-aspect-ratio: 6/5)';
const rmMQ = matchMedia(RM_Q), deskMQ = matchMedia(DESK_Q);
const reduced = () => rmMQ.matches;
const isDesk = () => deskMQ.matches;
const coarse = matchMedia('(pointer: coarse)').matches;

const nav = $('#nav'), hero = $('#home'), shaker = $('#shaker'), stage = $('#stage'), trailSvg = $('#trail'), trailG = $('#trailG');
const work = $('#work'), workInner = $('#workInner'), workStage = $('#workStage'), about = $('#about'), aboutInner = $('#aboutInner');
let busy = false;
const live = msg => { const l = $('#live'); l.textContent = ''; setTimeout(() => { l.textContent = msg; }, 40); };

/* ======================================================================
   SHARED ART (same drawings as the replay)
   ====================================================================== */
function cherryD(cx, cy, r, dx) {
  const p = (x, y) => `${x.toFixed(1)},${y.toFixed(1)}`;
  return `M${p(cx + dx, cy - 0.8 * r)} C${p(cx + dx + 0.25 * r, cy - 1.02 * r)} ${p(cx + r, cy - 1.0 * r)} ${p(cx + r, cy - 0.05 * r)} ` +
    `C${p(cx + r, cy + 0.58 * r)} ${p(cx + 0.55 * r, cy + r)} ${p(cx, cy + r)} C${p(cx - 0.55 * r, cy + r)} ${p(cx - r, cy + 0.58 * r)} ${p(cx - r, cy - 0.05 * r)} ` +
    `C${p(cx - r, cy - 1.0 * r)} ${p(cx + dx - 0.25 * r, cy - 1.02 * r)} ${p(cx + dx, cy - 0.8 * r)} Z`;
}
$('#cherL').setAttribute('d', cherryD(167, 528, 106, 34));
$('#cherR').setAttribute('d', cherryD(374, 514, 107, -36));
function sparkD(cx, cy, rx, ry, k = 0.085) {
  const a = rx * k, b = ry * k;
  return `M${cx},${cy - ry} Q${cx + a},${cy - b} ${cx + rx},${cy} Q${cx + a},${cy + b} ${cx},${cy + ry} Q${cx - a},${cy + b} ${cx - rx},${cy} Q${cx - a},${cy - b} ${cx},${cy - ry} Z`;
}
/* white sticker backing: the silhouette thickened (flat, no shadow) */
function makeBack(id, w) {
  const src = document.getElementById(id), g = el('g', { id: id + 'Back' }, src.parentNode);
  for (const s of src.querySelectorAll('.sil, .silx')) {
    const c = s.cloneNode(false); c.removeAttribute('id'); c.removeAttribute('class');
    const sw = parseFloat(s.getAttribute('stroke-width') || 0);
    if (s.getAttribute('fill') === 'none') { c.setAttribute('stroke', C.white); c.setAttribute('stroke-width', sw + w); }
    else { c.setAttribute('fill', C.white); c.setAttribute('stroke', C.white); c.setAttribute('stroke-width', sw + w); c.setAttribute('stroke-linejoin', 'round'); }
    g.appendChild(c);
  }

/* ======================================================================

  const u = desk ? Math.max(0.6, Math.min(vw / 1920, window.innerHeight / 1080)) : 1;
  document.documentElement.style.setProperty('--u', u.toFixed(4));

    const wh = work.clientHeight, k2 = Math.min(vw / 1760, wh / 1080);

  if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus({ preventScroll: true }); }
  if (e.key === 'Escape') { e.preventDefault(); setMore(false); moreBtn.focus({ preventScroll: true }); }
});
burger.addEventListener('click', () => setMenu(burger.getAttribute('aria-expanded') !== 'true'));
document.addEventListener('click', e => {
  const act = e.target.closest('[data-action]');
  if (act) {
    const a = act.dataset.action;
    if (a === 'shake') { closePanels(); shakeReset(); }
    if (a === 'scatter') { closePanels(); scatter(); }
    if (a === 'contact') { const open = contact.hidden; setMore(false); if (menu.classList.contains('open')) setMenu(false); setContact(open, act); }
    return;
  }
  if (!e.target.closest('.more')) setMore(false);
  if (!contact.hidden && !e.target.closest('#contact')) setContact(false);
  const link = e.target.closest('a[href^="#"]');
  if (link && !link.classList.contains('see')) {
    e.preventDefault();
    const id = link.getAttribute('href').slice(1);
    closePanels();
    let y = 0, focusEl = hero;
    if (id === 'work') { y = workTarget(); focusEl = work; }
    else if (id === 'about' || id === 'contact-block') { const t = document.getElementById(id); y = t.getBoundingClientRect().top + window.scrollY - navH() - (id === 'about' ? 0 : 160); focusEl = t; }
    scrollToY(Math.max(0, y), 1);
    gsap.delayedCall(reduced() ? 0 : 1, () => focusEl.focus({ preventScroll: true }));
  }
});
$('.top-btn').addEventListener('click', () => { scrollToY(0, 1); gsap.delayedCall(reduced() ? 0 : 1, () => hero.focus({ preventScroll: true })); });
$('.contact__close').addEventListener('click', () => setContact(false));
contact.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); setContact(false); } });
form.addEventListener('submit', e => {
  e.preventDefault();
  if (!msg.value.trim()) {
    if (!reduced()) gsap.fromTo(msg, { x: -10 }, { x: 0, duration: 0.6, ease: 'elastic.out(1,0.3)' });
    msg.focus({ preventScroll: true }); live('Write a message first'); return;
  }
  form.hidden = true; done.hidden = false; msg.value = '';
  if (!reduced()) gsap.fromTo($('svg', done), { scale: 0.2, opacity: 0, transformOrigin: '30% 90%' }, { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(2.4)' });
  live('Message sent. Mila says hi!');
  $('.contact__close').focus({ preventScroll: true });
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || lb.open) return;
  if (moreBtn.getAttribute('aria-expanded') === 'true') { setMore(false); moreBtn.focus({ preventScroll: true }); }
  else if (menu.classList.contains('open')) { setMenu(false); burger.focus({ preventScroll: true }); }
  else if (!contact.hidden) setContact(false);
  else if (searchOpen) { closeSearch(); searchBtn.focus({ preventScroll: true }); }
});
const onScroll = () => document.body.classList.toggle('scrolled', window.scrollY > 40);
window.addEventListener('scroll', onScroll, { passive: true });

/* ======================================================================
   ABOUT : decoration stickers
   ====================================================================== */
function decoSVG(art, box) { return `<svg viewBox="${box.join(' ')}" focusable="false"><use href="#${art}Back"/><use href="#${art}"/></svg>`; }
const DECO = [['#decoStar', 'starArt', BOX.star], ['#decoCherry', 'cherryArt', BOX.cherry], ['#decoCloud', 'ccloudArt', BOX.ccloud]];
DECO.forEach(([sel, art, box]) => {
  const d = $(sel); d.innerHTML = decoSVG(art, box);
  d.addEventListener('pointerenter', () => { if (!reduced()) gsap.fromTo(d, { rotation: 0 }, { keyframes: { rotation: [0, 9, -6, 3, 0] }, duration: 0.8, overwrite: 'auto' }); });
});
$('.aSpark').setAttribute('d', sparkD(98, 112, 34, 40, 0.12));
$('.aSpark2').setAttribute('d', sparkD(520, 470, 22, 26, 0.12));
gsap.set('.aHi', { svgOrigin: '414 214' });
$('#aboutCard').addEventListener('pointerenter', () => { if (!reduced()) gsap.fromTo('.aHi', { scale: 0.7 }, { scale: 1, duration: 0.6, ease: 'elastic.out(1.2,0.4)', overwrite: 'auto' }); });

/* ======================================================================
   SCROLL : parallax, pinned grid that pops in card by card, entrances
   ====================================================================== */
let ambient = !reduced();
const mm = gsap.matchMedia();
mm.add({ desk: DESK_Q, compact: `not all and ${DESK_Q}`, rm: RM_Q }, ctx => {
  const { desk, rm } = ctx.conditions;
  const navStyle = () => {
    const set = on => document.body.classList.toggle('in-work', on);
    ScrollTrigger.create({ trigger: work, start: 'top 45%', onEnter: () => set(true), onLeaveBack: () => set(false) });
    ScrollTrigger.create({ trigger: about, start: 'top 45%', onEnter: () => set(false), onLeaveBack: () => set(true) });
  };
  if (rm) { pinST = popST = null; navStyle(); return; }

  /* stickers drift apart as the page leaves (scrubbed) */
  const PAR = { ccloud: [-150, 0], pcloud: [-210, 0], cherry: [-120, -6], star: [-170, 8], bcloud: [-40, -3], cat: [-70, 4], title: [-110, 0], copy: [-60, 0], sp0: [-260, 0], sp1: [-240, 0], sp2: [-200, 0] };
  const htl = gsap.timeline({ scrollTrigger: { trigger: hero, start: 'top top', end: 'bottom top', scrub: 0.5 } });
  for (const k in PAR) htl.to(ITEMS[k].par, { y: PAR[k][0], rotation: PAR[k][1], ease: 'none' }, 0);

  if (desk) {
    pinST = ScrollTrigger.create({ trigger: work, start: 'top top', end: '+=100%', pin: true, anticipatePin: 1 });
    const ptl = gsap.timeline({ scrollTrigger: { trigger: work, start: 'top 70%', end: () => '+=' + Math.round(window.innerHeight * 1.6), scrub: 0.45 } });
    cards.forEach((c, i) => ptl.fromTo(c.el, { scale: 0.55, y: 26, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 1, ease: 'back.out(1.7)' }, i * 0.5));
    ptl.to({}, { duration: 0.3 });
    popST = ptl.scrollTrigger;
  } else {
    pinST = popST = null;
    gsap.set(cards.map(c => c.el), { opacity: 0, scale: 0.55, y: 26 });
    ScrollTrigger.batch(cards.map(c => c.el), { start: 'top 92%', once: true,
      onEnter: b => gsap.to(b, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: 'back.out(1.7)', stagger: 0.12, overwrite: true }) });
    /* no hover on a phone: each character comes alive as it reaches the middle of the screen */
    cards.forEach(c => ScrollTrigger.create({ trigger: c.el, start: 'top 62%', end: 'bottom 38%',
      onEnter: () => c.alive.enter(), onEnterBack: () => c.alive.enter(), onLeave: () => c.alive.leave(), onLeaveBack: () => c.alive.leave() }));
  }

  navStyle();
  /* about section: elements pop in when they reach the screen */
  const st = { trigger: '.about-grid', start: 'top 72%' };
  gsap.from('#aboutCard', { scrollTrigger: st, x: -60, rotation: -4, opacity: 0, duration: 0.7, ease: 'back.out(1.4)' });
  gsap.from('.aHi', { scrollTrigger: st, scale: 0, duration: 0.5, delay: 0.45, ease: 'back.out(2.4)' });
  gsap.from('.about-bars rect', { scrollTrigger: st, scaleX: 0, transformOrigin: '0 50%', duration: 0.5, stagger: 0.05, delay: 0.15, ease: 'power3.out' });
  gsap.from('.chip', { scrollTrigger: st, scale: 0.6, opacity: 0, duration: 0.45, stagger: 0.07, delay: 0.4, ease: 'back.out(2)', clearProps: 'transform,opacity' });
  gsap.from('.about-actions > *', { scrollTrigger: st, y: 24, opacity: 0, duration: 0.45, stagger: 0.08, delay: 0.55, ease: 'back.out(2)', clearProps: 'transform,opacity' });
  gsap.from('.deco', { scrollTrigger: st, scale: 0, rotation: -40, duration: 0.6, stagger: 0.12, delay: 0.3, ease: 'back.out(2.2)' });

  /* ambient loops: sparks twinkle, clouds breathe, eyes blink */
  SPARK_ITEMS.forEach((s, i) => gsap.to(s.wob, { scale: 1.14, duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: -1, repeatDelay: 1.4 + i * 0.6, delay: i * 0.9 }));
  ['pcloud', 'ccloud', 'bcloud'].forEach((k, i) => gsap.to(ITEMS[k].wob, { y: i === 2 ? 4 : -6, duration: 2.6 + i * 0.4, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: i * 0.7 }));
  cards.forEach(c => { const sp = $('.spark', c.svg); if (sp && c.n !== 5) { const [x, y] = CARD_SPARK[c.n]; gsap.to(sp, { scale: 1.12, svgOrigin: `${x} ${y}`, duration: 0.42, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: c.n * 0.3 }); } });
  gsap.to('.aSpark, .aSpark2', { scale: 1.15, transformOrigin: '50% 50%', duration: 0.55, ease: 'sine.inOut', yoyo: true, repeat: -1, stagger: 0.4 });
  ambient = true;
  return () => { ambient = false; pinST = popST = null; document.body.classList.remove('in-work'); };
});

function scheduleBlink(it) {
  gsap.delayedCall(rand(2.6, 6.5), () => { if (ambient && !document.hidden && !busy) blink(it); scheduleBlink(it); });
}
STICKERS.forEach(scheduleBlink);
{ const eyes = $('.aEyes'); gsap.set(eyes, { svgOrigin: '300 309' });
  const loop = () => gsap.delayedCall(rand(3, 6), () => { if (ambient) gsap.to(eyes, { keyframes: { scaleY: [1, 0.1, 1] }, duration: 0.22 }); loop(); }); loop(); }

/* ======================================================================
   START
   ====================================================================== */
let rz = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(applyLayout); });
applyLayout();
window.scrollTo(0, 0);
onScroll();
function layoutText() {
  fontsReady = true;
  for (const L of titleEls) fit(L.t, L.ch, L.box, TSW);
  for (const L of logoEls) fit(L.t, L.ch, L.box, 2.5);
  $$('.hiText').forEach(t => fit(t, 'HI!', [1041, 1137, 250, 305], 0));
  fit($('.hiText2'), 'HI!', [424, 506, 116, 164], 0);
  fit($('.hiText3'), 'HI!', [62, 178, 40, 100], 0);
}
Promise.all([document.fonts.load('900 100px "Nunito"', 'MILADRWSH!'), document.fonts.ready]).then(() => {
  layoutText();
  ScrollTrigger.refresh();
  document.documentElement.dataset.ready = '1';
});
})();
</script>
