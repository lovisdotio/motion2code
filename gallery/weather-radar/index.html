/* monotone interpolation (Fritsch-Carlson) */
function mono(pts) {
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); m[i] = k * a * d[i]; m[i + 1] = k * b * d[i]; }
  }
  return t => {
    if (t <= xs[0]) return ys[0];
    if (t >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (t > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], u = (t - xs[i]) / h, u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * ys[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * ys[i + 1] + (u3 - u2) * h * m[i + 1];
  };
}

const TT_STEPS = [[0, 16, 28], [1.0, 16, 16], [1.25, 16, 15], [1.5, 15, 15], [2.95, 15, 17], [4.45, 19, 17], [4.7, 19, 11], [6.2, 15, 19], [6.45, 19, 10], [6.95, 11, 11], [9.3, 11, 16], [9.7, 12, 16], [13.15, 12, 17], [13.32, 16, 28]];

/* ================= RAIN ================= */
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const drops = [];
for (let i = 0; i < 150; i++) {
  const s = 0.75 + rnd() * 0.5;
  const g = el('path', { d: 'M0,-12C3,-6 6.5,-1.5 6.5,3A6.5,6.5 0 0,1 -6.5,3C-6.5,-1.5 -3,-6 0,-12Z', fill: '#A9C4E8' }, $('rain'));
  drops.push({ g, x: rnd() * 1920, y0: rnd() * 1180, v: 560 + rnd() * 220, s });
}

/* ================= CURSOR ================= */
const CU = $('cursor');
const cArrow = el('path', { d: 'M0,0V56L13,43.5L23,66L32,62L22,40H39Z', fill: '#111111', stroke: '#FFFFFF', 'stroke-width': 2.6, 'stroke-linejoin': 'round' }, CU);
const cHand = el('g', { opacity: 0 }, CU);
el('path', { d: 'M-5,4C-5,-2 5,-2 5,4V26C5,22 15,22 15,27V30C15,26 25,26 25,31V34C25,30 34,30 34,36V52C34,62 27,70 17,70H4C-4,70 -9,64 -13,57L-22,40C-25,35 -18,30 -13,35L-5,44Z', fill: '#FFFFFF', stroke: '#111111', 'stroke-width': 2.8, 'stroke-linejoin': 'round' }, cHand);
for (const x of [5, 15, 25]) el('line', { x1: x, y1: 40, x2: x, y2: 52, stroke: '#111111', 'stroke-width': 2.2, 'stroke-linecap': 'round' }, cHand);

/* ================= TIMING ================= */
const DUR = 15;
// time slider handle (sampled frame by frame from the video)
const DRAG = mono([[1.125, 453], [1.25, 459], [1.375, 537], [1.5, 648], [1.625, 730], [1.75, 802], [1.875, 850], [2.0, 887], [2.125, 916], [2.25, 948],
  [2.375, 976], [2.5, 1008], [2.625, 1034], [2.75, 1062], [2.875, 1085], [3.0, 1110], [3.125, 1132], [3.25, 1154], [3.375, 1172], [3.5, 1192], [3.625, 1207],
  [3.75, 1224], [3.875, 1238], [4.0, 1252], [4.125, 1264], [4.25, 1276], [4.375, 1286], [4.5, 1296], [4.625, 1304], [4.75, 1312], [4.875, 1318], [5.0, 1324],
  [5.125, 1328], [5.25, 1332], [5.4, 1332]]);
function handleX(t) {
  if (t < 6.15) return DRAG(t);
  if (t < 9.13) return lerp(1332, 745, prog(t, 6.15, 6.42, 'power3.out'));
  if (t < 13.06) return lerp(745, 893, prog(t, 9.13, 9.38, 'power3.inOut'));
  return lerp(893, 453, prog(t, 13.1, 13.36, 'power2.inOut'));
}
const CURX = mono([[0, 722], [0.25, 696], [0.5, 548], [0.75, 478], [1.0, 462], [1.125, 462]]);
const CURY = mono([[0, 1125], [0.25, 1050], [0.5, 958], [0.75, 918], [1.0, 900], [1.125, 900]]);
const MOVE1X = mono([[5.3, 1341], [5.5, 1130], [5.75, 862], [6.0, 778], [6.12, 768], [8.0, 768], [9.0, 771], [12.0, 770], [12.25, 767], [12.5, 775], [12.625, 767], [12.75, 745], [12.875, 677], [13.0, 590], [13.1, 530], [13.3, 526], [13.55, 540], [13.75, 600], [13.9, 640], [15, 722]]);
const MOVE1Y = mono([[5.3, 900], [5.5, 962], [5.75, 970], [6.0, 966], [6.12, 962], [8.0, 962], [9.0, 963], [12.0, 960], [12.25, 956], [12.5, 960], [12.875, 962], [13.1, 962], [13.3, 963], [13.55, 975], [13.75, 1030], [13.9, 1125], [15, 1125]]);
function cursorAt(t) {
  if (t < 1.125) return [CURX(t), CURY(t)];
  if (t < 5.3) return [handleX(t) + 9, 900];
  return [MOVE1X(t), MOVE1Y(t)];
}
const mapMode = t => t < 9 ? prog(t, 6.38, 6.76, 'power1.inOut') : 1 - prog(t, 13.2, 13.6, 'power1.inOut');
const iconB = (t, i) => t < 9 ? prog(t, 6.38 + 0.02 * i, 6.58 + 0.02 * i, 'power2.inOut') : 1 - prog(t, 13.2 + 0.02 * i, 13.4 + 0.02 * i, 'power2.inOut');
function selW(t, i) {
  if (i === 0) return t < 9 ? 1 - prog(t, 6.13, 6.28) : prog(t, 13.1, 13.26);
  if (i === 2) return t < 9 ? prog(t, 6.13, 6.28) : 1 - prog(t, 9.13, 9.28);
  if (i === 3) return t < 11 ? prog(t, 9.13, 9.28) : 1 - prog(t, 13.1, 13.26);
  return 0;
}
const press = (t, at) => 1 - 0.12 * Math.sin(Math.PI * prog(t, at - 0.04, at + 0.08));

/* ================= RENDER ================= */
function render(t) {
  t = clamp(t, 0, DUR);
  /* --- map: blue ⇄ yellow --- */
  const m = mapMode(t);
  for (const k in regEls) regEls[k].setAttribute('fill', mix(REG[k][0], REG[k][1], m));
  const bo = t < 9 ? 1 - prog(t, 6.36, 6.72, 'power1.inOut') : prog(t, 13.22, 13.62, 'power1.out');
  $('blobL').setAttribute('opacity', f2(bo));
  $('blobSea').setAttribute('display', bo > 0 ? 'inline' : 'none');
  if (bo > 0) LEV.forEach((L, k) => blobEls[k].setAttribute('d', smoothClosed(blobPts(L, t))));

  /* --- clouds swelling then drifting --- */
  for (const c of clouds) {
    const a = prog(t, c.a0, c.a0 + 0.25) * (1 - prog(t, 13.15, 13.48, 'power1.in'));
    c.g.setAttribute('opacity', f2(a));
    if (a > 0) {
      const s = c.s(t) * (1 - 0.08 * prog(t, 13.15, 13.48));
      c.g.setAttribute('transform', `translate(${f2(c.x(t))} ${f2(c.y(t))}) scale(${f2(s)})`);
    }
  }
  /* --- big sun --- */
  const sIn = prog(t, 7.38, 7.9, 'back.out(1.4)'), sOut = prog(t, 13.18, 13.38, 'power2.in');
  sunG.setAttribute('opacity', f2(Math.min(1, prog(t, 7.38, 7.55)) * (1 - sOut)));
  if (t > 7.38 && sOut < 1) {
    sunG.setAttribute('transform', `translate(${SUNX} ${SUNY}) scale(${f2(Math.max(0.001, sIn * (1 - 0.25 * sOut)))})`);
    sunRays.setAttribute('transform', `rotate(${f2(-25 * (1 - sIn) + (t - 7.38) * 4)})`);
  }
  /* --- rotating wind arrows --- */
  arrowEls.forEach((a, i) => {
    const d = 0.012 * i;
    const sc = prog(t, 6.55 + d, 6.78 + d, 'back.out(2)');
    const op = Math.min(1, prog(t, 6.55 + d, 6.65 + d)) * (1 - prog(t, 9.58, 9.8));
    a.g.setAttribute('opacity', f2(op * 0.95));
    if (op > 0) {
      const ang = 135 + 180 * prog(t, 6.75 + d, 7.05 + d, 'power2.inOut') + 360 * prog(t, 7.1 + d, 8.75 + d, 'sine.inOut');
      a.g.setAttribute('transform', `translate(${a.x} ${a.y}) rotate(${f2(ang)}) scale(${f2(Math.max(0.001, sc))})`);
    }
  });
  /* --- lightning + flash --- */
  const bIn = prog(t, 9.5, 9.68, 'power2.out');
  const bOp = prog(t, 9.5, 9.54) * (t < 10.3 ? 1 : lerp(0.6, 0, prog(t, 10.3, 11.9, 'power1.in')));
  boltEl.setAttribute('opacity', f2(bOp));
  if (bOp > 0) {
    boltEl.setAttribute('fill', mix('#FFFFFF', '#F8DC7C', prog(t, 10.29, 10.36)));
    $('boltClipR').setAttribute('height', f2(30 + 560 * bIn));
    const s = 0.9 + 0.1 * bIn;
    boltEl.setAttribute('transform', `translate(1214 212) scale(${f2(s)}) translate(-1214 -212)`);
  }
  const fl = t < 9.52 || t > 9.92 ? 0 : (t < 9.57 ? prog(t, 9.52, 9.57) * 0.32 : t < 9.68 ? lerp(0.32, 0, prog(t, 9.57, 9.68)) : t < 9.74 ? lerp(0, 0.18, prog(t, 9.68, 9.74)) : lerp(0.18, 0, prog(t, 9.74, 9.92)));
  $('flash').setAttribute('opacity', f2(fl));
  /* --- rain --- */
  const rOp = prog(t, 9.5, 9.64) * (1 - prog(t, 11.75, 12.45));
  $('rain').setAttribute('display', rOp > 0 ? 'inline' : 'none');
  if (rOp > 0) {
    $('rain').setAttribute('opacity', f2(rOp * 0.9));
    for (const d of drops) {
      const y = ((d.y0 + d.v * (t - 9.5)) % 1180) - 50;
      d.g.setAttribute('transform', `translate(${f2(d.x)} ${f2(y)}) scale(${f2(d.s)} ${f2(d.s * 1.15)})`);
    }
  }
  /* --- avatar --- */
  const av = t < 9 ? prog(t, 6.5, 6.75) : 1 - prog(t, 13.4, 13.65);
  avB.setAttribute('opacity', f2(av)); avA.setAttribute('opacity', f2(1 - av));

  /* --- strip: handle, track, bubble --- */
  const hx = handleX(t);
  knob.setAttribute('cx', f2(hx));
  $('trackClipR').setAttribute('width', f2(hx));
  TT.setAttribute('transform', `translate(${f2(hx)} 891)`);
  let st = TT_STEPS[0]; for (const s of TT_STEPS) if (t >= s[0]) st = s;
  const w1 = TV[st[1]], w2 = TV[st[2]];
  set(ttB1, { x: -62, width: w1 }); set(ttB2, { x: -2, width: w2 });
  // active cell (background): MAR then MER
  const hOp = t < 9 ? prog(t, 6.13, 6.3, 'power2.out') : 1 - prog(t, 13.1, 13.28);
  const hxC = lerp(CX(2), CX(3), prog(t, 9.13, 9.33, 'power3.inOut'));
  hilite.setAttribute('opacity', f2(hOp));
  hilite.setAttribute('transform', `translate(${f2(hxC)} 961) scale(${f2(0.9 + 0.1 * prog(t, 6.13, 6.32, 'back.out(2)'))})`);
  // icons A ⇄ B, labels, temperature bars
  cells.forEach((c, i) => {
    const b = iconB(t, i);
    c.A.setAttribute('opacity', f2(1 - b)); c.B.setAttribute('opacity', f2(b));
    const pop = 1 - 0.14 * Math.sin(Math.PI * b);
    let sc = pop;
    if (i === 2) sc *= 1 + 0.2 * selW(t, 2);
    c.iconWrap.setAttribute('transform', `translate(${f2(c.x)} ${IY}) scale(${f2(sc)}) translate(0 ${-IY})`);
    if (c.reg) {
      const w = selW(t, i);
      c.reg.setAttribute('opacity', f2(1 - w)); c.bold.setAttribute('opacity', f2(w));
    } else {
      const w = lerp(TA[i], TB[i], b);
      set(c.bar, { x: f2(c.x - w / 2), width: f2(w) });
    }
  });
  // big day title: MON -> TUE -> WED -> MON
  const tw = [
    [6.13, 0, 1], [9.13, 1, 2], [13.1, 2, 0]
  ];
  let cur = 0; const off = [0, 0, 0], op = [0, 0, 0];
  op[0] = 1;
  for (const [at, from, to] of tw) {
    if (t >= at) {
      const p = prog(t, at, at + 0.3, 'power3.out');
      op.fill(0); off.fill(0);
      op[from] = 1 - p; off[from] = -40 * p;
      op[to] = p; off[to] = 40 * (1 - p);
      cur = to;
    }
  }
  titles.forEach((e, i) => { e.setAttribute('opacity', f2(op[i])); e.setAttribute('transform', `translate(0 ${f2(off[i])})`); });

  /* --- cursor --- */
  const [cx, cy] = cursorAt(t);
  const hand = t >= 12.38 && t < 12.97;
  const ps = press(t, 6.12) * press(t, 13.08);
  CU.setAttribute('transform', `translate(${f2(cx)} ${f2(cy)}) scale(${f2(ps)})`);
  cArrow.setAttribute('opacity', hand ? 0 : 1);
  cHand.setAttribute('opacity', hand ? 1 : 0);
}

/* ---------- GSAP clock ---------- */
const clock = { t: 0 };
const tl = gsap.timeline({ repeat: -1, paused: true });
tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => render(clock.t) });
window.anim = {
  tl, duration: DUR,
  seek(t) { t = clamp(t, 0, DUR); tl.pause(); tl.time(t, true); render(t); },
  play(from = 0) { tl.restart(); tl.time(from); tl.play(); },
  pause() { tl.pause(); }
};
const qs = new URLSearchParams(location.search);
render(0);
Promise.all([document.fonts.load('700 80px "Montserrat"', 'MONTUEWD'), document.fonts.load('600 21px "Montserrat"', 'MONTUEWD'), document.fonts.ready]).then(() => {
  if (qs.has('t')) anim.seek(parseFloat(qs.get('t')));
  else if (!qs.has('external')) tl.play(0);
  document.documentElement.dataset.ready = '1';
});
})();
</script>
</body>
</html>
