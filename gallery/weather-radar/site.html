<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weather Radar</title>
<meta name="description" content="Weather radar: rain bands, sun and storms over the coast, day by day.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=block&text=MONTUEWD" rel="stylesheet">
<style>
:root{
  --u:min(calc(100vw / 1920), calc(100svh / 760));
  --su:max(var(--u), .62px);
  --pu:max(var(--u), .72px);
  --sea:#5C7996; --ink:#1A2840; --nav:#2A4470; --blue:#1D72EC; --handle:#0F6FF8;
  --strip:#E9ECEF; --hilite:#CAD7E5; --pale:#EEF1F4; --yellow:#EFC242; --orange:#EF9804; --b1:#ADC9ED;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--ink)}
body{margin:0;background:var(--pale);color:var(--ink);font-family:'Montserrat',system-ui,-apple-system,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
input{font:inherit}
svg{display:block}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus{outline:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.b{display:block;border-radius:999px;background:currentColor}

/* ================= HERO: the radar app ================= */
.hero{position:relative;height:100vh;height:100svh;min-height:540px;overflow:hidden;background:var(--sea);isolation:isolate}
#map,#rainLayer{position:absolute;inset:0;width:100%;height:100%}
#rainLayer{pointer-events:none;z-index:4}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 2.8s cubic-bezier(.2,.6,.3,1) infinite}
.hit .ripple{stroke:#1D72EC;stroke-width:3;animation-duration:1.1s}
@keyframes ripple{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.4);opacity:0}}

.top{position:absolute;left:0;right:0;top:0;height:calc(150*var(--u));z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.logo{position:absolute;left:calc(50*var(--u));top:calc(37*var(--u));width:calc(111*var(--u));height:calc(73*var(--u));display:grid;place-items:center;border-radius:calc(14*var(--u))}
.logo svg{width:calc(87*var(--u));height:calc(49*var(--u));transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.logo:hover svg{transform:scale(1.07)}
.nav{position:absolute;left:0;top:0;width:0;height:0}
.nav a{position:absolute;top:calc(56*var(--u));height:calc(38*var(--u));left:calc((var(--cx) - var(--w) / 2 - 14) * var(--u));width:calc((var(--w) + 28) * var(--u));display:grid;place-items:center;color:var(--nav);border-radius:calc(10*var(--u))}
.nav a .b{width:calc(var(--w)*var(--u));height:calc(9*var(--u));transition:background-color .2s}
.nav a::after{content:'';position:absolute;left:50%;bottom:calc(1*var(--u));width:calc(6*var(--u));height:calc(6*var(--u));margin-left:calc(-3*var(--u));border-radius:50%;background:var(--blue);transform:scale(0);transition:transform .2s}
.nav a:hover .b,.nav a:focus-visible .b{background:var(--blue)}
.nav a:hover::after,.nav a:focus-visible::after,.nav a[aria-current=true]::after{transform:scale(1)}
.tool{position:absolute;display:grid;place-items:center;transition:transform .15s,background-color .2s}
.tool:active{transform:scale(.92)}
.tool svg{width:100%;height:100%}
.search{display:block;right:calc(225*var(--u));top:calc(42*var(--u));width:calc(202*var(--u));height:calc(63*var(--u));border-radius:999px;background:#fff}
.search:hover,.search[aria-expanded=true]{background:#F3F6F9}
.search .mag{position:absolute;left:calc(24*var(--u));top:calc(13*var(--u));width:calc(40*var(--u));height:calc(40*var(--u))}
.search .b{position:absolute;left:calc(74*var(--u));top:calc(26*var(--u));width:calc(102*var(--u));height:calc(10*var(--u));background:#2A3442}
.layers-btn{right:calc(147*var(--u));top:calc(45*var(--u));width:calc(56*var(--u));height:calc(56*var(--u));border-radius:50%}
.layers-btn:hover,.layers-btn[aria-expanded=true]{background:rgba(255,255,255,.6)}
.avatar{right:calc(67*var(--u));top:calc(42*var(--u));width:calc(62*var(--u));height:calc(62*var(--u));border-radius:50%}
.avatar:hover svg{transform:scale(1.06)}
.avatar svg{transition:transform .2s}
.menu-btn{display:none}

.fab{position:absolute;z-index:4;border-radius:50%;display:grid;place-items:center;transition:transform .15s}
.fab:hover{transform:scale(1.05)}
.fab:active{transform:scale(.9)}
.fab svg{width:100%;height:100%;overflow:visible}
.fab-expand{right:calc(65*var(--u));bottom:calc(228*var(--u));width:calc(80*var(--u));height:calc(80*var(--u))}
.fab-expand .ic-col,.fab-expand[aria-pressed=true] .ic-exp{display:none}
.fab-expand[aria-pressed=true] .ic-col{display:inline}
.fab-chat{right:calc(38*var(--u));bottom:calc(28*var(--u));width:calc(98*var(--u));height:calc(98*var(--u))}

/* forecast strip */
.strip{position:absolute;z-index:3;left:calc(50% - 896*var(--u));width:calc(1792*var(--u));bottom:calc(52*var(--u));height:calc(139*var(--u))}
.strip-bg{position:absolute;inset:0;background:var(--strip);opacity:.94;border-radius:calc(16*var(--u))}
.track-desk{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.day-title{position:absolute;left:calc(26*var(--u));top:calc(41*var(--u));width:calc(300*var(--u));height:calc(66*var(--u));pointer-events:none}
.play{position:absolute;left:calc(250*var(--u));top:calc(50*var(--u));width:calc(44*var(--u));height:calc(44*var(--u));border-radius:50%;transition:transform .15s}
.play:hover{transform:scale(1.08)}
.play:active{transform:scale(.9)}
.play svg{width:100%;height:100%}
.play .ic-pause,.play[aria-pressed=true] .ic-play{display:none}
.play[aria-pressed=true] .ic-pause{display:inline}
.rail-scroll{position:absolute;left:calc(316.1*var(--u));top:0;width:calc(1458*var(--u));height:100%}
.rail{position:relative;width:100%;height:100%}
.days{position:absolute;left:0;top:calc(11*var(--u));display:flex}
.day{position:relative;width:calc(145.8*var(--u));height:calc(122*var(--u));border-radius:calc(10*var(--u))}
.day::before{content:'';position:absolute;top:0;bottom:0;left:calc(9.9*var(--u));right:calc(9.9*var(--u));border-radius:inherit;background:rgba(202,215,229,0);transition:background-color .2s}
.day:hover::before{background:rgba(202,215,229,.5)}
.day.off{cursor:default}
.day.off:hover::before{background:transparent}
.day.off:active svg{transform:none}
.day svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transition:transform .15s}
.day:active svg{transform:scale(.92)}
.day:focus-visible{outline-offset:calc(-3*var(--u))}
.day text{transition:opacity .15s}
.day .bold,.day.sel .reg{opacity:0}
.day.sel .bold{opacity:1}
.hilite{position:absolute;left:0;top:calc(11*var(--u));width:calc(126*var(--u));height:calc(122*var(--u));border-radius:calc(10*var(--u));background:var(--hilite);opacity:0;pointer-events:none}
.track-mob{display:none}
.time{--ih:calc(30*var(--u));--th:calc(24*var(--u));position:absolute;z-index:2;top:calc(-13*var(--u));height:var(--ih);margin:0;padding:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:pan-y}
.time::-webkit-slider-runnable-track{height:var(--ih);background:transparent;border:0}
.time::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:var(--th);height:var(--th);margin-top:calc((var(--ih) - var(--th)) / 2);border:0;border-radius:50%;background:var(--handle);cursor:grab;transition:transform .15s}
.time:active::-webkit-slider-thumb{cursor:grabbing;transform:scale(1.2)}
.time:focus-visible{outline:none}
.time:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--blue)}
.time::-moz-range-track{height:var(--ih);background:transparent;border:0}
.time::-moz-range-thumb{width:var(--th);height:var(--th);border:0;border-radius:50%;background:var(--handle)}
.knob-ring{position:absolute;top:calc(-10*var(--u));width:calc(24*var(--u));height:calc(24*var(--u));pointer-events:none}
.knob-ring::before{content:'';position:absolute;inset:0;border-radius:50%;background:var(--handle);animation:pulse 2.4s ease-out infinite}
.hero.dragging .knob-ring,.hero.playing .knob-ring{display:none}
@keyframes pulse{0%{transform:scale(1);opacity:.45}70%,100%{transform:scale(2.6);opacity:0}}
.tip{position:absolute;left:0;top:calc(-71*var(--u));width:calc(168*var(--u));height:calc(57*var(--u));pointer-events:none;z-index:3}
.tip svg{width:100%;height:100%}

/* panels */
.panel{position:absolute;z-index:7;background:#fff;color:var(--ink);border-radius:calc(20*var(--pu));padding:calc(14*var(--pu));transform-origin:top right}
#searchPanel{right:calc(225*var(--u));top:calc(118*var(--u));width:calc(420*var(--pu))}
#layersPanel{right:calc(120*var(--u));top:calc(118*var(--u));width:calc(380*var(--pu))}
#accountPanel{right:calc(67*var(--u));top:calc(118*var(--u));width:calc(340*var(--pu))}
#navPanel{left:10px;right:10px;top:72px}
#chatPanel{right:calc(38*var(--u));bottom:calc(206*var(--u));width:calc(400*var(--pu));transform-origin:bottom right}
.row{display:flex;align-items:center;gap:calc(14*var(--pu));width:100%;min-height:44px;padding:calc(10*var(--pu));border-radius:calc(12*var(--pu));text-align:left;transition:background-color .15s,transform .12s}
.row:hover{background:var(--pale)}
.row:active{transform:scale(.98)}
.row .b{height:calc(9*var(--pu));width:calc(var(--w)*var(--pu));background:#2A3442}
.ico{flex:none;display:grid;place-items:center;width:calc(42*var(--pu));height:calc(42*var(--pu));border-radius:50%;background:var(--pale);color:var(--blue)}
.ico svg{width:56%;height:56%}
.ico.blue{background:var(--blue);color:#fff}
.stack{display:flex;flex-direction:column;gap:calc(9*var(--pu))}
.b.sub{opacity:.35}
.sw{margin-left:auto;flex:none;position:relative;width:calc(50*var(--pu));height:calc(30*var(--pu));border-radius:999px;background:#CAD7E5;transition:background-color .2s}
.sw::after{content:'';position:absolute;left:calc(4*var(--pu));top:calc(4*var(--pu));width:calc(22*var(--pu));height:calc(22*var(--pu));border-radius:50%;background:#fff;transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
[aria-checked=true] .sw{background:var(--blue)}
[aria-checked=true] .sw::after{transform:translateX(calc(20*var(--pu)))}
.panel-head{display:flex;align-items:center;gap:calc(14*var(--pu));padding:calc(6*var(--pu)) calc(10*var(--pu)) calc(12*var(--pu))}
.panel-head .b{height:calc(10*var(--pu));width:calc(var(--w)*var(--pu));background:var(--ink)}
.x{margin-left:auto;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--ink)}
.x:hover{background:var(--pale)}
.x svg{width:20px;height:20px}
.field{display:flex;align-items:center;gap:calc(10*var(--pu));height:calc(56*var(--pu));min-height:44px;padding:0 calc(16*var(--pu));border-radius:999px;background:var(--pale);margin-bottom:calc(8*var(--pu))}
.field svg{flex:none;width:calc(30*var(--pu));height:calc(30*var(--pu))}
.field input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--ink);font-size:16px;font-family:system-ui,-apple-system,sans-serif}
.field input:focus{outline:none}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--blue)}
.list{list-style:none;margin:0;padding:0}
.row .dist{margin-left:auto;opacity:.35}
.acct{display:flex;align-items:center;gap:calc(14*var(--pu));padding:calc(8*var(--pu)) calc(10*var(--pu)) calc(14*var(--pu));margin-bottom:calc(6*var(--pu));border-bottom:1px solid var(--pale)}
.acct svg{width:calc(54*var(--pu));height:calc(54*var(--pu))}
.msgs{display:flex;flex-direction:column;gap:calc(10*var(--pu));max-height:calc(300*var(--pu));overflow-y:auto;padding:calc(4*var(--pu)) calc(6*var(--pu)) calc(12*var(--pu))}
.msg{display:flex;align-items:center;gap:calc(10*var(--pu));max-width:85%;padding:calc(14*var(--pu)) calc(16*var(--pu));border-radius:calc(18*var(--pu));background:var(--pale)}
.msg .stack .b{height:calc(8*var(--pu));width:calc(var(--w)*var(--pu));background:#2A3442}
.msg.me{align-self:flex-end;background:var(--blue)}
.msg.me .stack .b{background:#fff}
.msg svg{flex:none;width:calc(44*var(--pu));height:calc(34*var(--pu))}
.typing i{display:block;width:calc(8*var(--pu));height:calc(8*var(--pu));border-radius:50%;background:#8E9DB0;animation:dot 1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.send{display:flex;gap:calc(10*var(--pu));align-items:center;margin-top:calc(6*var(--pu))}
.send .field{flex:1;margin:0}
.send-btn{flex:none;display:grid;place-items:center;width:calc(56*var(--pu));height:calc(56*var(--pu));min-width:44px;min-height:44px;border-radius:50%;background:var(--blue);color:#fff;transition:transform .12s}
.send-btn:active{transform:scale(.9)}
.send-btn svg{width:45%;height:45%}

/* ================= WEEK ================= */
.week{position:relative;z-index:2;background:var(--pale);padding:calc(150*var(--su)) calc(64*var(--su)) calc(170*var(--su))}
.wrap{max-width:calc(1792*var(--su));margin:0 auto}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:calc(48*var(--su));margin-bottom:calc(72*var(--su))}
.eyebrow{display:block;width:calc(84*var(--su));height:calc(10*var(--su));border-radius:99px;background:var(--blue);transform-origin:left center}
.eyebrow.y{background:var(--yellow)}
.hbars{display:flex;flex-direction:column;gap:calc(18*var(--su));margin-top:calc(30*var(--su))}
.hbars i{display:block;height:calc(30*var(--su));border-radius:99px;background:var(--ink);width:calc(var(--w)*var(--su));max-width:100%;transform-origin:left center}
.para{display:flex;flex-direction:column;gap:calc(16*var(--su))}
.para i{display:block;height:calc(10*var(--su));border-radius:99px;background:#8E9DB0;width:calc(var(--w)*var(--su));max-width:100%;transform-origin:left center}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(32*var(--su))}
.card{position:relative;height:calc(640*var(--su));perspective:calc(2400*var(--su))}
.card-inner{position:relative;height:100%;transform-style:preserve-3d}
.face{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(40*var(--su));border-radius:calc(28*var(--su));background:var(--bg);color:var(--fg);-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden}
.front{transition:transform .2s}
.front:active{transform:scale(.985)}
.back{transform:rotateY(180deg)}
.face-top{display:flex;align-items:center;justify-content:space-between;min-height:calc(64*var(--su))}
.dname{font-weight:700;font-size:calc(64*var(--su));line-height:1}
.dname.sm{font-size:calc(40*var(--su))}
.big{flex:1;width:100%;min-height:0;margin:calc(10*var(--su)) 0;transition:transform .45s cubic-bezier(.2,.9,.2,1)}
.front:hover .big{transform:translateY(calc(-8*var(--su))) scale(1.03)}
.meta{display:flex;flex-direction:column;gap:calc(16*var(--su))}
.hilo{display:flex;gap:calc(14*var(--su));align-items:center}
.hilo i{display:block;height:calc(18*var(--su));border-radius:99px;background:currentColor;width:calc(var(--w)*var(--su))}
.hilo .lo{opacity:.45}
.range{position:relative;height:calc(10*var(--su));border-radius:99px;background:rgba(255,255,255,.5)}
.range i{position:absolute;top:0;bottom:0;left:var(--a);right:calc(100% - var(--b));border-radius:99px;background:var(--acc)}
.ln{display:block;height:calc(10*var(--su));border-radius:99px;background:currentColor;opacity:.5;width:calc(var(--w)*var(--su));max-width:100%}
.round{display:grid;place-items:center;width:calc(60*var(--su));height:calc(60*var(--su));min-width:44px;min-height:44px;border-radius:50%;background:#fff;color:var(--blue);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.round svg{width:44%;height:44%}
.flip{position:absolute;inset:0;z-index:1;border-radius:calc(28*var(--su))}
.flip .round{position:absolute;top:calc(36*var(--su));right:calc(36*var(--su))}
.flip:hover .round,.unflip:hover{transform:rotate(-40deg)}
.flip:focus-visible{outline:3px solid var(--blue);outline-offset:-6px}
.mini{width:100%;flex:1;min-height:0;margin:calc(14*var(--su)) 0}
.wind{display:flex;align-items:center;gap:calc(16*var(--su));margin-bottom:calc(22*var(--su))}
.wind svg{flex:none;width:calc(52*var(--su));height:calc(52*var(--su))}
.wind .stack{gap:calc(10*var(--su))}
.vane{transform-box:fill-box;transform-origin:center;animation:vane 3.6s ease-in-out infinite}
@keyframes vane{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(18deg)}}
.to-map{display:flex;align-items:center;gap:calc(14*var(--su));align-self:flex-start;height:calc(62*var(--su));min-height:44px;padding:0 calc(28*var(--su)) 0 calc(22*var(--su));border-radius:99px;background:var(--blue);color:#fff;transition:transform .15s}
.to-map:hover{transform:translateY(-2px)}
.to-map:active{transform:scale(.95)}
.to-map svg{width:calc(26*var(--su));height:calc(26*var(--su));min-width:18px;min-height:18px}
.to-map .b{width:calc(110*var(--su));height:calc(10*var(--su));background:#fff}
.drop{animation:fall 1.4s linear infinite}
@keyframes fall{0%{transform:translateY(-14px);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flicker{animation:flicker 3.2s steps(1) infinite}
@keyframes flicker{0%,6%,12%{opacity:1}3%,9%{opacity:.25}}

/* ================= HOUR BY HOUR ================= */
.hourly{position:relative;z-index:2;height:100vh;height:100svh;min-height:600px;background:var(--sea);color:#fff;overflow:hidden}
.hourly .wrap{height:100%;max-width:none;display:grid;grid-template-columns:calc(520*var(--su)) minmax(0,1fr);align-items:center;gap:calc(60*var(--su));padding:0 calc(64*var(--su))}
.h-copy{display:flex;flex-direction:column;gap:calc(28*var(--su))}
.hday{font-weight:700;font-size:calc(120*var(--su));line-height:.9}
.para.light i{background:rgba(255,255,255,.6)}
.legend{list-style:none;margin:calc(10*var(--su)) 0 0;padding:0;display:flex;flex-direction:column;gap:calc(16*var(--su))}
.legend li{display:flex;align-items:center;gap:calc(14*var(--su))}
.legend .b{height:calc(9*var(--su));width:calc(var(--w)*var(--su));background:rgba(255,255,255,.75)}
.sw-line{display:block;width:calc(34*var(--su));height:calc(6*var(--su));border-radius:99px;background:#fff}
.sw-col{display:block;width:calc(16*var(--su));height:calc(26*var(--su));border-radius:calc(5*var(--su));background:var(--b1)}
.sw-sun{display:block;width:calc(22*var(--su));height:calc(22*var(--su));border-radius:50%;background:var(--orange)}
#hchart{width:100%;height:auto;max-height:84svh}

/* ================= FOOTER ================= */
.foot{position:relative;z-index:2;background:var(--ink);color:#fff;padding:calc(100*var(--su)) calc(64*var(--su)) calc(56*var(--su))}
.foot-grid{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:calc(48*var(--su))}
.foot-col{display:flex;flex-direction:column;gap:calc(14*var(--su));align-items:flex-start}
.fh{display:block;height:calc(10*var(--su));border-radius:99px;background:#fff;width:calc(var(--w)*var(--su));margin-bottom:calc(10*var(--su))}
.foot-col a{display:flex;align-items:center;min-height:32px;border-radius:6px}
.foot-col a .b{height:calc(9*var(--su));min-height:6px;width:calc(var(--w)*var(--su));background:rgba(255,255,255,.5);transition:background-color .2s}
.foot-col a:hover .b,.foot-col a:focus-visible .b{background:var(--yellow)}
.logo-sm{display:inline-block;border-radius:10px}
.logo-sm svg{width:calc(87*var(--su));height:calc(49*var(--su));min-width:60px;min-height:34px}
.para.dim i{background:rgba(255,255,255,.3)}
.foot-bottom{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:calc(90*var(--su));padding-top:calc(30*var(--su));border-top:1px solid rgba(255,255,255,.14)}
.foot-bottom>.b{height:calc(9*var(--su));min-height:6px;width:calc(220*var(--su));background:rgba(255,255,255,.3)}
.soc{display:flex;gap:calc(14*var(--su))}
.soc .round{background:rgba(255,255,255,.1);color:#fff}
.soc .round:hover{background:var(--blue);transform:translateY(-3px)}

/* ================= MOBILE / TABLET ================= */
@media (max-width:1023px){
  :root{--pu:.85px}
  .hero{min-height:600px}
  .top{height:76px}
  .logo{left:6px;top:12px;width:78px;height:52px;border-radius:12px}
  .logo svg{width:54px;height:30px}
  .nav{display:none}
  .search{right:166px;top:16px;width:44px;height:44px}
  .search .mag{left:7px;top:7px;width:30px;height:30px}
  .search .b{display:none}
  .layers-btn{right:116px;top:16px;width:44px;height:44px;background:#fff}
  .layers-btn:hover,.layers-btn[aria-expanded=true]{background:#F3F6F9}
  .avatar{right:66px;top:16px;width:44px;height:44px}
  .menu-btn{display:grid;right:14px;top:16px;width:44px;height:44px;border-radius:50%;background:#fff}
  .menu-btn svg{width:22px;height:22px}
  #searchPanel,#layersPanel,#accountPanel,#navPanel{left:10px;right:10px;width:auto;top:72px}
  #chatPanel{left:10px;right:10px;width:auto;top:auto;bottom:calc(330px + env(safe-area-inset-bottom))}
  .fab-expand{right:14px;bottom:calc(200px + env(safe-area-inset-bottom));width:50px;height:50px}
  .fab-chat{right:12px;bottom:calc(262px + env(safe-area-inset-bottom));width:56px;height:56px}
  .strip{left:10px;right:10px;width:auto;bottom:calc(10px + env(safe-area-inset-bottom));height:178px}
  .strip-bg{border-radius:16px}
  .track-desk{display:none}
  .day-title{left:8px;top:6px;width:150px;height:33px}
  .play{left:auto;right:10px;top:4px;width:38px;height:38px}
  .tip{left:auto;right:56px;top:5px;width:104px;height:35px;transform:none!important}
  .rail-scroll{left:0;right:0;width:auto;top:44px;bottom:0;height:auto;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain;border-radius:0 0 16px 16px}
  .rail-scroll::-webkit-scrollbar{display:none}
  .rail{width:max(100%, 720px);height:134px}
  .days{top:32px;left:0;right:0}
  .day{flex:1 0 72px;width:auto;height:98px;border-radius:10px}
  .day::before{left:5px;right:5px}
  .hilite{top:32px;width:62px;height:98px;border-radius:10px}
  .track-mob{display:block;position:absolute;top:16px;height:4px;border-radius:2px;background:#CAD7E5}
  .track-mob i{display:block;width:0;height:100%;border-radius:inherit;background:var(--blue)}
  .time{--ih:30px;--th:22px;top:3px}
  .knob-ring{top:7px;width:22px;height:22px}
  .week{padding:72px 20px 84px}
  .sec-head{flex-direction:column;align-items:flex-start;gap:26px;margin-bottom:36px}
  .cards{grid-template-columns:minmax(0,1fr);gap:18px}
  .card{height:440px}
  .hourly .wrap{grid-template-columns:minmax(0,1fr);align-content:center;gap:22px;padding:0 20px}
  .hday{font-size:64px}
  #hchart{max-height:50svh}
  .foot{padding:64px 20px 40px}
  .foot-grid{grid-template-columns:1fr 1fr;gap:34px 20px}
  .foot-grid .brand{grid-column:1 / -1}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .knob-ring{display:none}
}
</style>
</head>
<body>
<main>
<section class="hero" id="radar" aria-label="Weather radar">
  <h1 class="sr-only">Weather Radar</h1>
  <svg id="map" role="img" aria-label="Radar map of the coast: MON, rain bands" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="landClip"><path id="landPath" clip-rule="evenodd"/></clipPath>
      <clipPath id="boltClip"><rect id="boltClipR" x="1000" y="190" width="420" height="0"/></clipPath>
    </defs>
    <rect x="-200" y="-200" width="2320" height="1480" fill="#5C7996"/>

      <g id="regions"></g>
      <g id="blobL"></g>
    </g>

    <g id="arrows"></g>
    <g id="sunBig"></g>
    <g id="clouds"></g>
    <g id="bolt" clip-path="url(#boltClip)"></g>
    <rect id="flash" x="-200" y="-200" width="2320" height="1480" fill="#FFFFFF" opacity="0"/>

  <header class="top" id="top">

      <svg viewBox="62 49 87 49" aria-hidden="true"><path d="M131,49L149,49L131,98L113,98Z" fill="#E2263C"/><path d="M97,49L114,49L131,98L114,98Z" fill="#EA880A"/><path d="M97,49L114,49L99,98L82,98Z" fill="#2CA883"/><path d="M62,49L80,49L99,98L81,98Z" fill="#0B59D1"/></svg>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#radar" aria-label="Radar" aria-current="true" style="--cx:288;--w:62"><i class="b"></i></a>
      <a href="#week" aria-label="Forecast" style="--cx:410;--w:64"><i class="b"></i></a>
      <a href="#hourly" aria-label="Hour by hour" style="--cx:544;--w:90"><i class="b"></i></a>
      <a href="#week" aria-label="Next days" style="--cx:683;--w:64"><i class="b"></i></a>
      <a href="#hourly" aria-label="Sun and rain" style="--cx:819;--w:94"><i class="b"></i></a>
      <a href="#radar" aria-label="Maps" style="--cx:961;--w:84"><i class="b"></i></a>
      <a href="#footer" aria-label="More" style="--cx:1085;--w:56"><i class="b"></i></a>
    </nav>
    <button class="tool search" id="btnSearch" type="button" aria-label="Search places" aria-expanded="false" aria-controls="searchPanel">
      <svg class="mag" viewBox="1517 55 40 40" aria-hidden="true"><circle cx="1532" cy="70" r="10.5" fill="none" stroke="#1E2A3A" stroke-width="3.2"/><line x1="1540" y1="78" x2="1549" y2="87" stroke="#1E2A3A" stroke-width="3.6" stroke-linecap="round"/></svg>
      <i class="b"></i>
    </button>
    <button class="tool layers-btn" id="btnLayers" type="button" aria-label="Map layers" aria-expanded="false" aria-controls="layersPanel">
      <svg viewBox="1717 45 56 56" aria-hidden="true"><path d="M1745,56L1762,65L1745,74L1728,65Z" fill="none" stroke="#1E2A3A" stroke-width="2.8" stroke-linejoin="round"/><path d="M1730,74L1745,82L1760,74M1730,83L1745,91L1760,83" fill="none" stroke="#1E2A3A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="tool avatar" id="btnAccount" type="button" aria-label="Account" aria-expanded="false" aria-controls="accountPanel">
      <svg id="avatarSvg" viewBox="1791 42 62 62" aria-hidden="true"></svg>
    </button>
    <button class="tool menu-btn" id="btnMenu" type="button" aria-label="Menu" aria-expanded="false" aria-controls="navPanel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="2.6" rx="1.3" fill="#1E2A3A"/><rect x="3" y="10.7" width="18" height="2.6" rx="1.3" fill="#1E2A3A"/><rect x="3" y="16.4" width="12" height="2.6" rx="1.3" fill="#1E2A3A"/></svg>
    </button>

    <div class="panel" id="searchPanel" role="dialog" aria-label="Search places" hidden>
      <div class="field">
        <svg viewBox="1517 55 40 40" aria-hidden="true"><circle cx="1532" cy="70" r="10.5" fill="none" stroke="#1E2A3A" stroke-width="3.2"/><line x1="1540" y1="78" x2="1549" y2="87" stroke="#1E2A3A" stroke-width="3.6" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" aria-label="Search a place, then press Enter" autocomplete="off" enterkeyhint="search">
      </div>
      <ul class="list">
        <li><button class="row" type="button" data-marker="0" aria-label="Show the north city on the map"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12,2C7.6,2 4,5.6 4,10c0,6 8,12 8,12s8-6 8-12c0-4.4-3.6-8-8-8Z" fill="currentColor"/><circle cx="12" cy="10" r="3" fill="#fff"/></svg></span><span class="stack"><i class="b" style="--w:110"></i><i class="b sub" style="--w:70"></i></span><i class="b dist" style="--w:34"></i></button></li>
        <li><button class="row" type="button" data-marker="1" aria-label="Show the coast city on the map"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12,2C7.6,2 4,5.6 4,10c0,6 8,12 8,12s8-6 8-12c0-4.4-3.6-8-8-8Z" fill="currentColor"/><circle cx="12" cy="10" r="3" fill="#fff"/></svg></span><span class="stack"><i class="b" style="--w:96"></i><i class="b sub" style="--w:84"></i></span><i class="b dist" style="--w:28"></i></button></li>
        <li><button class="row" type="button" data-marker="2" aria-label="Show the harbour town on the map"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12,2C7.6,2 4,5.6 4,10c0,6 8,12 8,12s8-6 8-12c0-4.4-3.6-8-8-8Z" fill="currentColor"/><circle cx="12" cy="10" r="3" fill="#fff"/></svg></span><span class="stack"><i class="b" style="--w:120"></i><i class="b sub" style="--w:62"></i></span><i class="b dist" style="--w:38"></i></button></li>
        <li><button class="row" type="button" data-marker="3" aria-label="Show the east city on the map"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12,2C7.6,2 4,5.6 4,10c0,6 8,12 8,12s8-6 8-12c0-4.4-3.6-8-8-8Z" fill="currentColor"/><circle cx="12" cy="10" r="3" fill="#fff"/></svg></span><span class="stack"><i class="b" style="--w:88"></i><i class="b sub" style="--w:76"></i></span><i class="b dist" style="--w:30"></i></button></li>
      </ul>
    </div>

    <div class="panel" id="layersPanel" role="dialog" aria-label="Map layers" hidden>
      <div class="panel-head"><span class="ico blue"><svg viewBox="1717 45 56 56" aria-hidden="true"><path d="M1745,56L1762,65L1745,74L1728,65Z" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linejoin="round"/><path d="M1730,74L1745,82L1760,74M1730,83L1745,91L1760,83" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><i class="b" style="--w:120"></i></div>
      <button class="row" type="button" role="switch" aria-checked="true" data-layer="rain" aria-label="Rain radar"><span class="ico"><svg viewBox="-9 -14 18 24" aria-hidden="true"><path d="M0,-12C3,-6 6.5,-1.5 6.5,3A6.5,6.5 0 0,1 -6.5,3C-6.5,-1.5 -3,-6 0,-12Z" fill="currentColor"/></svg></span><i class="b" style="--w:130"></i><span class="sw" aria-hidden="true"></span></button>
      <button class="row" type="button" role="switch" aria-checked="true" data-layer="clouds" aria-label="Clouds"><span class="ico"><svg viewBox="-40 -26 80 52" aria-hidden="true"><path id="layerCloudIco" fill="currentColor"/></svg></span><i class="b" style="--w:96"></i><span class="sw" aria-hidden="true"></span></button>
      <button class="row" type="button" role="switch" aria-checked="true" data-layer="wind" aria-label="Wind arrows"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><i class="b" style="--w:112"></i><span class="sw" aria-hidden="true"></span></button>
      <button class="row" type="button" role="switch" aria-checked="true" data-layer="cities" aria-label="Cities"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12,2C7.6,2 4,5.6 4,10c0,6 8,12 8,12s8-6 8-12c0-4.4-3.6-8-8-8Z" fill="currentColor"/><circle cx="12" cy="10" r="3" fill="#fff"/></svg></span><i class="b" style="--w:84"></i><span class="sw" aria-hidden="true"></span></button>
    </div>

    <div class="panel" id="accountPanel" role="dialog" aria-label="Account" hidden>
      <div class="acct"><svg id="acctAv" viewBox="1791 42 62 62" aria-hidden="true"></svg><span class="stack"><i class="b" style="--w:140;height:calc(10*var(--pu));background:var(--ink)"></i><i class="b sub" style="--w:190;height:calc(8*var(--pu));background:var(--ink)"></i></span></div>
      <a class="row" href="#week" aria-label="Next days"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="4" y="5.5" width="16" height="14.5" rx="3"/><path d="M4 10.5h16M9 3.5v4M15 3.5v4"/></svg></span><i class="b" style="--w:120"></i></a>
      <a class="row" href="#hourly" aria-label="Hour by hour"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.5l3 2"/></svg></span><i class="b" style="--w:150"></i></a>
      <a class="row" href="#footer" aria-label="Help and settings"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 16.6v.1M9.8 9.6a2.3 2.3 0 1 1 3.2 2.1c-.7.3-1 .9-1 1.6"/></svg></span><i class="b" style="--w:100"></i></a>
    </div>

    <nav class="panel" id="navPanel" aria-label="Main menu" hidden>

      <a class="row" href="#week" aria-label="Forecast"><i class="b" style="--w:104"></i></a>
      <a class="row" href="#hourly" aria-label="Hour by hour"><i class="b" style="--w:144"></i></a>
      <a class="row" href="#week" aria-label="Next days"><i class="b" style="--w:104"></i></a>
      <a class="row" href="#hourly" aria-label="Sun and rain"><i class="b" style="--w:150"></i></a>
      <a class="row" href="#radar" aria-label="Maps"><i class="b" style="--w:134"></i></a>
      <a class="row" href="#footer" aria-label="More"><i class="b" style="--w:90"></i></a>

  <div class="strip" id="strip">

    <svg class="track-desk" viewBox="0 0 1792 139" preserveAspectRatio="none" aria-hidden="true">

    <svg class="day-title" viewBox="0 0 300 66" aria-hidden="true">

  </div>

  </button>
  <button class="fab fab-chat" id="btnChat" type="button" aria-label="Open the weather assistant" aria-expanded="false" aria-controls="chatPanel">
    <svg viewBox="-49 -49 98 98" aria-hidden="true"><circle r="49" fill="#1A6FEB"/><rect x="-23" y="-19" width="46" height="36" rx="6" fill="#FFFFFF"/><rect x="-17" y="5" width="22" height="4" rx="2" fill="#1A6FEB"/><circle cx="10" cy="9" r="4.5" fill="#1A6FEB"/></svg>
  </button>
  <div class="panel" id="chatPanel" role="dialog" aria-label="Weather assistant" hidden>
    <div class="panel-head"><span class="ico blue"><svg viewBox="-30 -26 60 52" aria-hidden="true"><rect x="-23" y="-19" width="46" height="36" rx="6" fill="currentColor"/><rect x="-17" y="5" width="22" height="4" rx="2" fill="#1D72EC"/></svg></span><span class="stack"><i class="b" style="--w:120"></i><i class="b sub" style="--w:80;height:calc(8*var(--pu))"></i></span><button class="x" id="chatClose" type="button" aria-label="Close the assistant"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button></div>
    <div class="msgs" id="msgs" aria-live="polite">
      <div class="msg bot"><span class="stack"><i class="b" style="--w:190"></i><i class="b" style="--w:130"></i></span><span class="sr-only">Hi, ask me about the weather.</span></div>
    </div>
    <form class="send" id="chatForm">
      <div class="field"><input id="chatInput" type="text" aria-label="Ask about the weather" autocomplete="off" enterkeyhint="send"></div>

    </form>
  </div>

  <svg id="rainLayer" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g id="rain" display="none"></g></svg>
  <p class="sr-only" id="live" aria-live="polite"></p>
</section>

<section class="week" id="week" aria-labelledby="weekTitle">
  <div class="wrap">
    <div class="sec-head">
      <div>
        <h2 id="weekTitle" class="sr-only">The next three days: MON, TUE, WED</h2>
        <i class="eyebrow reveal"></i>
        <div class="hbars" aria-hidden="true"><i class="reveal" style="--w:560"></i><i class="reveal" style="--w:380"></i></div>
      </div>
      <div class="para" aria-hidden="true"><i class="reveal" style="--w:520"></i><i class="reveal" style="--w:470"></i><i class="reveal" style="--w:300"></i></div>
    </div>
    <div class="cards">
      <article class="card" data-i="0" data-day="0" aria-label="MON" style="--bg:#ADC9ED;--fg:#1A2840;--acc:#1266D7">
        <div class="card-inner">
          <div class="face front">
            <div class="face-top"><span class="dname">MON</span></div>
            <svg class="big" data-icon="rain" viewBox="0 0 300 240" aria-hidden="true"></svg>
            <div class="meta" aria-hidden="true">
              <div class="hilo"><i style="--w:84"></i><i class="lo" style="--w:56"></i></div>
              <div class="range"><i style="--a:14%;--b:48%"></i></div>
              <i class="ln" style="--w:300"></i><i class="ln" style="--w:210"></i>
            </div>
            <button class="flip" type="button" aria-expanded="false" aria-controls="back-0" aria-label="Show MON hour by hour"><span class="round"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-14.3 4.9"/><path d="M4 12a8 8 0 0 1 14.3-4.9"/><path d="M18.6 3v4.3h-4.3"/><path d="M5.4 21v-4.3h4.3"/></svg></span></button>
          </div>
          <div class="face back" id="back-0" inert>

  tw(S, { yel: sunny ? 1 : 0, duration: D(.38), ease: 'power1.inOut' });

  const W = hero.clientWidth, H = hero.clientHeight;
  if (!W || !H) return;
  const s = Math.max(W / 1920, H / 1080), vw = W / s, vh = H / s;
  const fx = compact ? F.x : 960;
  const x = clamp(fx - vw / 2, 0, 1920 - vw), y = clamp(540 - vh / 2, 0, 1080 - vh);
  Object.assign(VB_STATE, { x, y, w: vw, h: vh });
  const vb = `${f2(x)} ${f2(y)} ${f2(vw)} ${f2(vh)}`;
  mapSvg.setAttribute('viewBox', vb);
  rainSvg.setAttribute('viewBox', vb);
}
function layout() {
  compact = matchMedia('(max-width: 1023px)').matches;
  cells.forEach(c => {
    if (!compact) { c.svg.setAttribute('viewBox', DESK_VB); return; }
    const w = c.btn.clientWidth || 72, h = c.btn.clientHeight || 98, vh = 147, vw = vh * w / h;
    c.svg.setAttribute('viewBox', `${f2(-vw / 2)} ${f2(961 - vh / 2)} ${f2(vw)} ${f2(vh)}`);
  });
  const rr = rail.getBoundingClientRect(), b0 = cells[0].btn.getBoundingClientRect(), b1 = cells[1].btn.getBoundingClientRect();
  pitch = b1.left - b0.left; c0 = b0.left - rr.left + b0.width / 2;
  U = compact ? 1 : strip.offsetWidth / 1792;
  const thumb = compact ? 22 : 24 * U;
  timeIn.style.left = f2(c0 - thumb / 2) + 'px';
  timeIn.style.width = f2(VMAX * pitch + thumb) + 'px';
  knobRing.style.left = f2(c0 - thumb / 2) + 'px';
  hilite.style.left = f2(c0 - hilite.offsetWidth / 2) + 'px';
  trackMob.style.left = f2(c0) + 'px';
  trackMob.style.width = f2(VMAX * pitch) + 'px';
  railLeft = railScroll.offsetLeft;
  if (!compact) tipEl.style.transform = '';
  fitMap();
  lastV = -1;
}

/* ================= SCROLLING (ScrollTrigger) ================= */
let lastP = 0;
function setupScroll() {
  if (RM) { renderHourly(1, .5); return; }
  /* 1. the map stays pinned: scrolling advances radar time (like dragging the slider) */
  ScrollTrigger.create({
    trigger: hero, start: 'top top', end: '+=120%', pin: true, anticipatePin: 1,
    onUpdate(self) {
      const p = self.progress;
      if (Math.abs(p - lastP) < 1e-4) return;
      lastP = p;
      if (programmatic || dragging) return;
      stopPlay(); follow = true;
      setV(lerp(anchorV, VMAX, p), .5, 'power3.out');
    }
  });
  /* 2. entrance: bar titles then cards */
  gsap.from('#week .reveal', { scaleX: 0, duration: .8, ease: 'power3.out', stagger: .07, scrollTrigger: { trigger: '#week .sec-head', start: 'top 85%' } });
  gsap.from('#week .card', { y: 90, opacity: 0, duration: .9, ease: 'power3.out', stagger: .12, scrollTrigger: { trigger: '#week .cards', start: 'top 88%' } });
  /* 3. hour by hour: pinned section, the day draws itself as you scroll */
  const H = { p: 0 };
  renderHourly(0);
  gsap.to(H, { p: 1, ease: 'none', onUpdate: () => renderHourly(H.p), scrollTrigger: { trigger: '#hourly', start: 'top top', end: '+=150%', pin: true, scrub: .6 } });
  gsap.from('#hourly .h-copy > *', { x: -40, opacity: 0, duration: .7, ease: 'power3.out', stagger: .08, scrollTrigger: { trigger: '#hourly', start: 'top 70%' } });
  /* 4. footer */
  gsap.from('.foot-col', { y: 30, opacity: 0, duration: .7, ease: 'power3.out', stagger: .08, scrollTrigger: { trigger: '.foot', start: 'top 92%' } });
}

/* ================= STARTUP ================= */
new IntersectionObserver(es => { heroVisible = es[0].isIntersecting; }).observe(hero);
layout();
render();
gsap.ticker.add(render);
setupScroll();
let rz = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(layout); });
document.fonts.ready.then(() => {
  layout();
  ScrollTrigger.refresh();
  document.documentElement.dataset.ready = '1';
});
window.site = { S, selectDay, setV, get scene() { return scene; }, get selected() { return selected; } };
})();
</script>
