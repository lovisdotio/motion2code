/* curves sampled frame by frame (24 fps), smoothed with monotone Hermite */
function mono(pts) {
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), d = [], m = [];

  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;

  }
  // timestamp tooltip
  const v2 = seg(t, 9.12, 9.24, 'back.out(2)') * (1 - seg(t, 10.75, 10.85));
  if (v2 > 0) { show(tip2, true); set(tip2, { opacity: f2(clamp(v2)), transform: `translate(1396 821) scale(${f2(lerp(0.85, 1, v2))}) translate(-1396 -821)` }); }
}

function cursorAt(t) {
  let x, y;
  if (t < 14.25) { x = CX(t); y = CY(t); }
  else { // end: the cursor heads back to its opening position to loop
    const p = seg(t, 14.25, 14.92, 'power3.inOut'), q = 1 - p;
    x = q * q * 436 + 2 * q * p * 1180 + p * p * 1708; y = q * q * 1016 + 2 * q * p * 960 + p * p * 550;
  }
  const isHand = HAND.some(([a, b]) => t >= a && t < b);
  let press = 0;
  CLICKS.forEach(([ct, cx, cy], i) => {
    press = Math.max(press, Math.max(0, 1 - Math.abs(t - ct) / 0.09));
    const p = clamp((t - ct) / 0.45);
    const on = t >= ct && p < 1;
    set(ripples[i], { cx, cy, r: f2(8 + 34 * ease('power2.out')(p)), opacity: on ? f2(0.9 * (1 - p)) : 0 });
  });
  const k = 1 - 0.1 * press;
  show(arrow, !isHand); show(hand, isHand);
  if (isHand) set(hand, { transform: `translate(${f2(x)} ${f2(y)}) scale(${f2(4.5 * k)}) translate(-5.5 0)` });
  else set(arrow, { transform: `translate(${f2(x)} ${f2(y)}) scale(${f2(5.2 * k)})` });
}

function render(t) {
  t = clamp(t, 0, DUR);
  set(page, { transform: `translate(0 ${f2(-scrollAt(t))})` });
  coverAt(t); dotAt(t); waveAt(t); playerAt(t); listAt(t); transcriptAt(t); cursorAt(t);
}

/* ---------- GSAP clock ---------- */
const clock = { t: 0 };
const tl = gsap.timeline({ repeat: -1, paused: true });
tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => render(clock.t) });
window.anim = {
  tl, duration: DUR,
  seek(t) { t = clamp(t, 0, DUR); tl.pause(); tl.time(t, true); render(t); },
  play(from = 0) { tl.restart(); tl.time(from); tl.play(); },
  pause() { tl.pause(); }
};
const qs = new URLSearchParams(location.search);
render(0);
Promise.all([document.fonts.load('400 72px "Inter"', 'EP12PLAY'), document.fonts.ready]).then(() => {
  if (qs.has('t')) anim.seek(parseFloat(qs.get('t')));
  else if (!qs.has('external')) tl.play(0);
  document.documentElement.dataset.ready = '1';
});
})();
</script>
