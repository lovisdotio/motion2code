<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Podcast Player</title>
<meta name="description" content="EP 12, a flat-design podcast player: play, scrub, read along and jump through the episode.">
<meta name="theme-color" content="#0F120F">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F120F;--coral:#F37448;--cream:#F8EACB;--teal:#006860;--lteal:#A9CCB9;--line:#2C302B;
  --grey:#8E918A;--tip:#1A1E19;--nav:#E6E1D3;--hover:#3A2219;--outline:#8F8D84;--ink:#0F120F;--sb:#3A3E38;
  --hh:clamp(64px,6.25vw,120px);
  --rowh:clamp(64px,4.74vw,91px);
  --thumb:clamp(44px,3.23vw,62px);
  --barh:clamp(9px,.625vw,12px);
  --ph:clamp(66px,4.06vw,78px);
  --pg:clamp(10px,.8vw,15.3px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);scroll-behavior:smooth;scrollbar-color:var(--sb) var(--bg)}
body{margin:0;background:var(--bg);color:var(--cream);font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
svg{display:block}
:focus{outline:none}
:focus-visible{outline:2px solid var(--cream);outline-offset:3px;border-radius:8px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}
.b{display:block;height:9px;border-radius:5px;background:var(--grey)}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.skip{position:fixed;left:16px;top:-60px;z-index:100;background:var(--cream);color:var(--ink);padding:10px 16px;border-radius:24px;font-size:14px;transition:top .2s}
.skip:focus{top:12px}

/* ---------- header ---------- */
.hdr{position:relative;z-index:40;display:grid;grid-template-columns:auto 1fr auto;align-items:center;height:var(--hh);padding:calc(var(--hh)*.283) 34px 0 32px}
.logo{display:block;width:clamp(64px,5.42vw,104px);border-radius:6px}
.logo svg{width:100%;height:auto}
.nav{display:flex;justify-content:center;gap:clamp(22px,2.55vw,49px);padding-right:clamp(0px,1vw,18px)}
.nav a{position:relative;font-size:clamp(14px,.88vw,16.8px);color:var(--nav);padding:10px 0;letter-spacing:.005em;transition:color .2s}
.nav a::after{content:'';position:absolute;left:0;right:0;bottom:4px;height:2px;border-radius:2px;background:var(--coral);transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.3,.7,.2,1)}
.nav a:hover{color:var(--cream)}
.nav a:hover::after,.nav a:focus-visible::after{transform:scaleX(1)}
.acts{grid-column:3;display:flex;align-items:center;gap:clamp(8px,1vw,20px)}
.pw{position:relative}
.ib{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;transition:background .2s}
.ib:hover{background:var(--tip)}
.ib svg{width:42px;height:42px;overflow:visible}
#bellBtn svg{width:56px;height:56px}
.pill{height:58px;padding:0 30px;border:2px solid var(--outline);border-radius:29px;font-size:clamp(14px,.88vw,16.8px);color:var(--nav);transition:background .25s,color .25s,border-color .25s;white-space:nowrap}
.pill:hover{border-color:var(--cream)}
.pill[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:var(--ink)}
.av{display:block;width:60px;height:60px;border-radius:50%}
.av svg{width:100%;height:100%}
.burger{display:none}
.pop{position:absolute;right:0;top:calc(100% + 10px);z-index:60;min-width:270px;background:var(--tip);border-radius:14px;padding:10px;box-shadow:none}
.pop .it{display:flex;align-items:center;gap:14px;width:100%;padding:10px;border-radius:10px;text-align:left;font-size:15px;color:var(--nav)}
.pop .it:hover,.pop .it:focus-visible{background:#262B25}
.pop .it svg.th{width:40px;height:40px;flex:none}
.pop .bars{display:flex;flex-direction:column;gap:8px;flex:1}
.pop .unread{width:9px;height:9px;border-radius:50%;background:var(--coral);flex:none}
.pop .it.read .unread{background:transparent}
.pop .ico{width:22px;height:22px;flex:none}
.mnav{position:absolute;z-index:45;left:12px;right:12px;top:calc(var(--hh) + 4px);background:var(--tip);border-radius:16px;padding:12px;display:flex;flex-direction:column}
.mnav a{font-size:22px;padding:14px 12px;border-radius:10px;color:var(--nav)}
.mnav a:hover{background:#262B25}
.mnav .pill{margin:10px 12px 6px;align-self:flex-start}

/* ---------- player ---------- */
.app{position:relative;display:grid;grid-template-columns:minmax(0,900fr) minmax(0,898fr);column-gap:clamp(24px,2.92vw,56px);padding:0 34px 6px 32px}
.col-left{container-type:inline-size;min-width:0;--u:calc(100cqw / 900)}
.stage{position:relative;aspect-ratio:900/810}
.stage>svg.art{position:absolute;inset:0;width:100%;height:100%}
.ov,.ov2{position:absolute;display:block;width:max(var(--min,44px),calc(var(--w) * var(--u)));height:max(var(--min,44px),calc(var(--h) * var(--u)));transform:translate(-50%,-50%);border-radius:12px;transition:scale .15s}
.ov{left:calc((var(--x) - 32) * var(--u));top:calc((var(--y) - 120) / 810 * 100%)}
.ov2{left:max(22px,calc((var(--x) - 32) * var(--u)));top:50%}
.ov>svg,.ov2>svg{position:absolute;left:50%;top:50%;width:calc(var(--w) * var(--u));height:calc(var(--h) * var(--u));transform:translate(-50%,-50%);overflow:visible;pointer-events:none}
.ov:active,.ov2:active{scale:.92}
.playlbl text,.art text{font-family:'Inter',system-ui,sans-serif}
.playlbl .ul{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);transition:transform .35s cubic-bezier(.3,.7,.2,1)}
.playlbl[aria-pressed="true"] .ul{transform:scaleX(1)}
.playlbl:hover text{fill:#fff}
.knob{cursor:grab;touch-action:none;border-radius:50%}
.knob.drag{cursor:grabbing}
#saveBtn .chk{opacity:0}
#saveBtn[aria-pressed="true"] .pls{opacity:0}
#saveBtn[aria-pressed="true"] .chk{opacity:1}
.track-row{position:relative;height:max(44px,calc(52 * var(--u)))}
.tbar{position:absolute;top:50%;height:max(6px,calc(9 * var(--u)));border-radius:6px;background:var(--grey);transform:translateY(-50%)}
.tbar.l{left:calc(4 * var(--u));width:calc(56 * var(--u))}
.tbar.r{left:calc(832 * var(--u));width:calc(61 * var(--u))}
.seek{--p:0;--pad:calc(14 * var(--u));position:absolute;left:calc(74 * var(--u));width:calc(746 * var(--u));top:0;bottom:0;touch-action:none;cursor:pointer;border-radius:10px}
.seek .rail,.seek .fill{position:absolute;left:var(--pad);top:50%;transform:translateY(-50%);border-radius:4px}
.seek .rail{right:var(--pad);height:max(2px,calc(3.5 * var(--u)));background:var(--line)}
.seek .fill{width:calc(var(--p) * (100% - 2 * var(--pad)));height:max(3px,calc(4.5 * var(--u)));background:var(--cream)}
.seek .thumb{position:absolute;top:50%;left:calc(var(--pad) + var(--p) * (100% - 2 * var(--pad)));width:max(14px,calc(26 * var(--u)));height:max(14px,calc(26 * var(--u)));border-radius:50%;background:var(--cream);transform:translate(-50%,-50%);transition:width .15s,height .15s}
.seek:hover .thumb,.seek.drag .thumb{width:max(18px,calc(32 * var(--u)));height:max(18px,calc(32 * var(--u)))}
.seek .tip{position:absolute;bottom:calc(50% + max(14px,calc(22 * var(--u))));left:var(--hx,0);width:max(96px,calc(120 * var(--u)));transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .15s}
.seek .tip svg{width:100%;height:auto}
.seek.tipon .tip{opacity:1}
.ctl-row{position:relative;height:max(64px,calc(92 * var(--u)))}
.ov2.big{--min:58px}
.ov2.big .ring{opacity:0}
#ppBtn .ic-pause{display:none}
#ppBtn[data-on="1"] .ic-pause{display:inline}
#ppBtn[data-on="1"] .ic-play{display:none}
#likeBtn .hf{opacity:0}
#likeBtn[aria-pressed="true"] .hf{opacity:1}
#repeatBtn[aria-pressed="true"] path{stroke:var(--coral)}
.ov2:hover>svg [stroke]:not(.ring){stroke:#fff}
.ov2.big:hover>svg .disc{fill:#fff}

/* ---------- right panel ---------- */
.panel{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.tabs{display:flex;justify-content:space-between;align-items:center;height:clamp(48px,3.125vw,60px);flex:none}
.tab{position:relative;font-size:clamp(12.5px,.74vw,14.2px);color:var(--grey);padding:10px 2px;letter-spacing:.01em;transition:color .2s}
.tab:hover{color:var(--nav)}
.tab[aria-selected="true"]{color:var(--nav)}
.tab::after{content:'';position:absolute;left:0;right:0;bottom:3px;height:2px;border-radius:2px;background:var(--coral);transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.3,.7,.2,1)}
.tab[aria-selected="true"]::after{transform:scaleX(1)}
.tabpanels{position:relative;flex:1;min-height:0}
.tabpanel{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-top:3px;scrollbar-width:thin}
.rows{list-style:none;margin:0;padding:0}
.row{position:relative;height:var(--rowh)}
.row+.row::before{content:'';position:absolute;left:0;right:0;top:0;height:1.5px;background:var(--line)}
.row-main{position:absolute;inset:0;display:flex;align-items:center;text-align:left;border-radius:6px}
.row-main .bg{position:absolute;inset:0 0 calc(var(--rowh) * .066);border-radius:6px;background:transparent;transition:background .25s}
.row:first-child .row-main .bg{inset:0 0 calc(var(--rowh) * .066)}
.row+.row .row-main .bg{inset:3px 0 2px}
.row:hover .row-main .bg{background:var(--tip)}
.row.active .row-main .bg{background:var(--coral)}
.row-main svg.th{position:absolute;left:calc(var(--rowh) * .088);top:50%;width:var(--thumb);height:var(--thumb);transform:translateY(-50%);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.row:hover svg.th{transform:translateY(-50%) scale(1.08) rotate(-8deg)}
.row-main .rb{position:absolute;left:calc(var(--rowh) * .978);right:90px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:calc(var(--barh) * 1.4)}
.row-main .rb i{display:block;height:var(--barh);border-radius:var(--barh)}
.row.active .rb i{background:var(--teal)!important}
.row .pw{position:static}
.keb{position:absolute;right:11px;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;display:grid;place-items:center;z-index:2}
.keb:hover{background:rgba(248,234,203,.1)}
.keb svg{width:6px;height:24px}
.row .liked{position:absolute;right:62px;top:50%;width:26px;height:24px;margin-top:-12px;pointer-events:none;opacity:0;transform:scale(0)}
.row.is-liked .liked{opacity:1;transform:scale(1)}
.row .pop{right:8px;top:calc(50% + 20px);min-width:200px}
@media (min-width:901px){.row:nth-last-child(-n+3) .pop{top:auto;bottom:calc(50% + 20px)}}
.paras{padding:0 0 10px}
.para{--p:0;--hc:var(--coral);position:relative;display:block;width:100%;height:var(--ph);margin:0 0 var(--pg);border-radius:4px;text-align:left}
.para .hov,.para .hl,.para .ln,.para .tealbg{position:absolute;inset:0;border-radius:4px;pointer-events:none}
.para .hov{background:var(--hover);opacity:0;transition:opacity .2s}
.para .hov::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cream)}
.para:hover .hov,.para:focus-visible .hov{opacity:1}
.para .tealbg{background:var(--teal);opacity:0;transition:opacity .3s}
.para.started .tealbg{opacity:1}
.para .hl{right:auto;width:calc(var(--p) * 100%);background:var(--hc)}
.para .ln i{position:absolute;height:9px;border-radius:5px;background:var(--cream)}
.para .ln.dk{clip-path:inset(0 calc((1 - var(--p)) * 100%) 0 0)}
.para .ln.dk i{background:var(--ink)}
.para .ring{position:absolute;inset:-1px;border:2.6px solid var(--cream);border-radius:5px;opacity:0;pointer-events:none}
.para .chip{position:absolute;left:var(--cx,50%);top:-14px;width:88px;height:55px;margin-left:-44px;border-radius:9px;background:var(--tip);opacity:0;transform:translateY(-6px) scale(.9);transition:opacity .15s,transform .2s;pointer-events:none;z-index:3}
.para .chip i{position:absolute;left:21px;top:22.5px;width:46px;height:10px;border-radius:5px;background:var(--cream)}
.para:hover .chip{opacity:1;transform:none}
.para .now{position:absolute;right:28px;top:50%;width:26px;height:24px;margin-top:-12px;opacity:0;transform:scale(0);pointer-events:none}
.ttl{position:relative;padding:calc(var(--pg) * 3) 0 30px}
.ttl .dv{width:184px;height:1.5px;background:var(--line);margin-bottom:56px}
.ttl .t1{width:min(448px,60%);height:34px;border-radius:17px;background:var(--cream);margin-bottom:46px}
.ttl .t2{display:flex;gap:10px}
.semi{position:absolute;width:110px;height:55px;bottom:0;right:18%;border-radius:55px 55px 0 0;background:var(--teal);transform-origin:50% 100%;opacity:0;transition:opacity .4s;pointer-events:none}
.panel.tr .semi{opacity:1}
.pfoot{position:relative;display:flex;align-items:center;height:clamp(48px,3.4vw,60px);margin-top:4px}
.dots{position:absolute;left:46%;display:flex;gap:0;transform:translateX(-50%)}
.dots button{display:grid;place-items:center;width:28px;height:32px;border-radius:8px}
.dots i{display:block;width:10px;height:10px;border-radius:50%;background:#B8BBAE;transition:background .25s,transform .25s}
.dots button[aria-pressed="true"] i{background:var(--coral);transform:scale(1.15)}

/* ---------- map ---------- */
.map{position:relative;height:100vh;height:100svh;overflow:hidden;border-top:1.5px solid var(--line)}
.map-head{position:absolute;z-index:4;left:32px;right:34px;top:clamp(28px,5vh,56px);display:flex;align-items:center;gap:16px}
.map-head .t1{width:clamp(160px,23vw,448px);height:clamp(22px,1.8vw,34px);border-radius:20px;background:var(--cream)}
.map-head .cnt{margin-left:auto;display:flex;gap:10px;align-items:center}
.map-head .cnt i{display:block;width:10px;height:10px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
.map-head .cnt i.on{background:var(--coral);transform:scale(1.2)}
.map-cover{position:absolute;z-index:3;left:32px;top:50%;width:min(52vh,38vw,560px);aspect-ratio:1;transform:translateY(-50%);pointer-events:none}
.map-cover .disc{position:absolute;width:56%;aspect-ratio:1;border-radius:50%;background:var(--teal);right:-20%;bottom:-6%}
.map-cover .disc2{position:absolute;width:30%;aspect-ratio:1;border-radius:50%;background:var(--coral);left:-6%;top:-4%}
.map-cover .mc-in{position:relative;width:100%;height:100%}
.map-cover svg{position:relative;width:100%;height:100%}
.strip-wrap{position:absolute;z-index:2;left:0;right:0;top:50%;transform:translateY(-46%);overflow:hidden}
.strip{position:relative;width:max(2600px,230vw);height:clamp(300px,56vh,560px);padding-left:0;margin-left:calc(min(52vh,38vw,560px) * .62 + 32px)}
.strip svg.sw{position:absolute;left:0;right:0;bottom:0;width:100%;height:68%}
.mk{position:absolute;top:0;height:32%;display:flex;flex-direction:column;align-items:flex-start;transform:translateX(-31px)}
.mk::after{content:'';position:absolute;left:30px;top:var(--thumb);width:2px;height:calc(244% - var(--thumb));background:var(--line);transition:background .3s}
.mk button{position:relative;display:flex;align-items:center;gap:14px;padding:0;border-radius:40px;text-align:left}
.mk svg.th{width:var(--thumb);height:var(--thumb);flex:none;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.mk .mb{display:flex;flex-direction:column;gap:9px}
.mk .mb i{display:block;height:10px;border-radius:5px}
.mk button:hover svg.th{transform:scale(1.12) rotate(-10deg)}
.mk.on::after{background:var(--cream)}
.mk.on svg.th{outline:3px solid var(--coral);outline-offset:4px;border-radius:50%}
.map-prog{position:absolute;z-index:4;left:32px;right:34px;bottom:clamp(100px,11vh,130px);height:4px;border-radius:3px;background:var(--line)}
.map-prog .f{position:absolute;inset:0;border-radius:3px;background:var(--cream);transform-origin:left;transform:scaleX(0)}
.map-prog .tk{position:absolute;top:-5px;width:2px;height:14px;background:var(--line)}

/* ---------- episodes ---------- */
.eps{position:relative;padding:clamp(80px,9vw,170px) 32px clamp(80px,8vw,150px)}
.sec-head{display:flex;align-items:center;gap:16px;max-width:1520px;margin:0 auto clamp(36px,4vw,64px)}
.sec-head .t1{width:clamp(160px,23vw,448px);height:clamp(22px,1.8vw,34px);border-radius:20px;background:var(--cream)}
.sec-head .t2{width:clamp(60px,6vw,125px);height:9px;border-radius:5px;background:var(--coral)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2vw,36px);max-width:1520px;margin:0 auto}
.card{position:relative;perspective:1600px;aspect-ratio:1/1.08}
.card-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.7,0,.2,1)}
.card.flipped .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.front{background:var(--tip)}
.back{transform:rotateY(180deg);display:flex;flex-direction:column;padding:clamp(22px,2.2vw,40px)}
.flip{position:absolute;inset:0;width:100%;height:100%;border-radius:16px;text-align:left}
.flip .caw{position:absolute;left:17%;top:9%;width:66%;aspect-ratio:1;transition:transform .7s cubic-bezier(.34,1.56,.64,1)}
.flip svg.ca{width:100%;height:100%}
.flip:hover .caw,.flip:focus-visible .caw{transform:rotate(14deg) scale(1.04)}
.flip .fb{position:absolute;left:clamp(20px,2vw,36px);right:clamp(20px,2vw,36px);bottom:clamp(20px,2vw,34px);display:flex;flex-direction:column;gap:12px}
.flip .fb .t1{width:58%;height:clamp(16px,1.2vw,22px);border-radius:12px;background:var(--cream)}
.flip .fb .t2{display:flex;gap:8px}
.flip .corner{position:absolute;right:clamp(16px,1.6vw,26px);top:clamp(16px,1.6vw,26px);width:40px;height:40px;border-radius:50%;border:2px solid var(--outline);display:grid;place-items:center;transition:transform .4s cubic-bezier(.34,1.56,.64,1),border-color .2s}
.flip:hover .corner{transform:rotate(90deg);border-color:var(--cream)}
.flip .corner svg{width:16px;height:16px}
.flip .ep{position:absolute;left:clamp(20px,2vw,36px);top:clamp(16px,1.6vw,26px);display:flex;gap:6px;align-items:center}
.flip .ep i{display:block;width:10px;height:10px;border-radius:50%}
.back .lines{display:flex;flex-direction:column;gap:clamp(12px,1.1vw,20px);flex:1}
.back .lines .l{display:flex;gap:8px}
.back .lines .l i{display:block;height:9px;border-radius:5px}
.back .t1{width:62%;height:clamp(18px,1.4vw,26px);border-radius:14px;margin-bottom:clamp(14px,1.6vw,28px)}
.back .acts2{display:flex;gap:12px;align-items:center}
.rb2{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor;transition:transform .2s,background .2s}
.rb2:hover{transform:scale(1.08)}
.rb2 svg{width:22px;height:22px}
.rb2.flipback{margin-left:auto}
.rb2[aria-pressed="true"]{background:currentColor}
.rb2[aria-pressed="true"] svg *{stroke:var(--bk);fill:var(--bk)}
.rb2 .chk{display:none}
.rb2.q[aria-pressed="true"] .pls{display:none}
.rb2.q[aria-pressed="true"] .chk{display:inline}

/* ---------- footer ---------- */
.foot{position:relative;overflow:hidden;padding:clamp(80px,8vw,150px) 32px 0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;border-top:1.5px solid var(--line)}
.hosts{display:flex;gap:clamp(24px,5vw,96px);max-width:1520px;width:100%;margin:0 auto;flex-wrap:wrap}
.host{display:flex;align-items:center;gap:clamp(16px,1.6vw,28px)}
.host svg.ha{width:clamp(110px,11vw,210px);height:auto;aspect-ratio:1;transition:transform .7s cubic-bezier(.34,1.56,.64,1)}
.host:hover svg.ha{transform:rotate(-16deg) scale(1.05)}
.host .hb{display:flex;flex-direction:column;gap:12px}
.host .hb .t1{width:clamp(110px,10vw,200px);height:clamp(16px,1.2vw,22px);border-radius:12px;background:var(--cream)}
.follow{margin-top:8px;align-self:flex-start;width:52px;height:52px;border-radius:50%;background:var(--teal);display:grid;place-items:center;transition:transform .2s,background .25s}
.follow:hover{transform:scale(1.08)}
.follow svg{width:20px;height:20px}
.follow .chk{display:none}
.follow[aria-pressed="true"]{background:var(--coral)}
.follow[aria-pressed="true"] .pls{display:none}
.follow[aria-pressed="true"] .chk{display:inline}
.foot-mid{max-width:1520px;width:100%;margin:clamp(60px,7vw,130px) auto 0;display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;position:relative;z-index:2}
.foot-mid .tb .dv{width:184px;height:1.5px;background:var(--line);margin-bottom:46px}
.foot-mid .tb .t1{width:clamp(220px,23vw,448px);height:clamp(24px,1.8vw,34px);border-radius:20px;background:var(--cream);margin-bottom:34px}
.foot-mid .tb .t2{display:flex;gap:10px}
.fnav{display:flex;gap:clamp(18px,2vw,40px);flex-wrap:wrap}
.fnav a{font-size:15px;color:var(--nav);padding:8px 0}
.fnav a:hover{color:var(--coral)}
.totop{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--cream);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.totop:hover{transform:translateY(-4px)}
.totop svg{width:24px;height:24px}
.foot-art{position:relative;flex:1;min-height:clamp(260px,34vw,560px);margin:0 -32px}
.semi-big{position:absolute;left:50%;bottom:0;width:min(1100px,92vw);aspect-ratio:2/1;margin-left:calc(min(1100px,92vw) / -2);border-radius:1100px 1100px 0 0;background:var(--teal);transform-origin:50% 100%}
.foot-art .cdot{position:absolute;width:clamp(56px,6vw,120px);aspect-ratio:1;border-radius:50%;background:var(--coral);left:calc(50% + min(1100px,92vw) * .36);bottom:calc(min(1100px,92vw) * .36)}
.foot-art .cdot2{position:absolute;width:clamp(30px,3vw,60px);aspect-ratio:1;border-radius:50%;background:var(--cream);left:calc(50% - min(1100px,92vw) * .42);bottom:calc(min(1100px,92vw) * .28)}
.foot-art .flogo{position:absolute;left:50%;bottom:clamp(28px,3vw,56px);width:clamp(90px,9vw,170px);transform:translateX(-50%)}
.foot-art .flogo svg{width:100%;height:auto}

/* ---------- floating ---------- */
.fab{position:fixed;z-index:50;right:36px;bottom:11px;width:113px;height:106px;border-radius:50%}
.fab svg{width:100%;height:100%;overflow:visible}
.fab .bub{transform-box:fill-box;transform-origin:center}
.fab[aria-expanded="true"] .bub{transform:scale(.88)}
.chat{position:fixed;z-index:55;right:36px;bottom:128px;width:min(380px,calc(100vw - 24px));background:var(--tip);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.chat-h{display:flex;align-items:center;gap:12px}
.chat-h .lv{width:12px;height:12px;border-radius:50%;background:var(--coral)}
.chat-h .t1{width:140px;height:12px;border-radius:6px;background:var(--cream)}
.chat-h .x{margin-left:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.chat-h .x:hover{background:#262B25}
.chat-h .x svg{width:16px;height:16px}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:280px;overflow-y:auto;padding:4px 2px;scrollbar-width:thin}
.msg{display:flex;align-items:flex-end;gap:10px;max-width:86%}
.msg svg.th{width:30px;height:30px;flex:none}
.msg .bb{border-radius:16px 16px 16px 4px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;background:#262B25}
.msg .bb i{display:block;height:7px;border-radius:4px;background:var(--nav)}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bb{background:var(--coral);border-radius:16px 16px 4px 16px}
.msg.me .bb i{background:var(--ink)}
.msg .rx{width:34px;height:34px}
.reacts{display:flex;gap:10px;border-top:1.5px solid var(--line);padding-top:12px}
.react{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:24px;background:#262B25;font-size:15px;font-variant-numeric:tabular-nums;color:var(--nav);transition:background .2s}
.react:hover{background:#30362F}
.react svg{width:22px;height:22px}
.react .n{display:inline-block;min-width:2ch;text-align:left}
.mini{position:fixed;z-index:48;left:32px;bottom:16px;width:min(560px,calc(100vw - 200px));height:68px;border-radius:34px;background:var(--tip);display:flex;align-items:center;gap:12px;padding:0 18px 0 8px;transform:translateY(140%);opacity:0;transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .3s}
.mini.on{transform:none;opacity:1}
.mini .mth{width:52px;height:52px;flex:none}
.mini .mpp{width:44px;height:44px;border-radius:50%;background:var(--cream);display:grid;place-items:center;flex:none}
.mini .mpp svg{width:18px;height:18px}
.mini .mpp .ic-pause{display:none}
.mini .mpp[data-on="1"] .ic-pause{display:inline}
.mini .mpp[data-on="1"] .ic-play{display:none}
.mini .mt{font-size:15px;color:var(--cream);white-space:nowrap;flex:none;letter-spacing:.02em}
.mini .mw{flex:1;min-width:0;height:44px;position:relative;cursor:pointer;touch-action:none;border-radius:8px}
.mini .mw svg{position:absolute;left:0;right:0;top:0;width:100%;height:34px}
.mini .mw .ml{position:absolute;left:0;right:0;bottom:4px;height:3px;border-radius:2px;background:var(--line)}
.mini .mw .mf{position:absolute;left:0;bottom:4px;height:3px;border-radius:2px;background:var(--cream);width:calc(var(--p,0) * 100%)}
.toast{position:fixed;z-index:70;left:50%;top:22px;display:flex;align-items:center;gap:12px;padding:12px 18px 12px 14px;border-radius:24px;background:var(--cream);transform:translate(-50%,-90px);opacity:0;pointer-events:none}
.toast svg{width:22px;height:22px}
.toast .tt{font-weight:700;font-size:18px;line-height:1;color:var(--ink);white-space:nowrap;letter-spacing:-.01em}  /* real words: 'EP 11 · Nu-disco', 'Liked' */

/* ---------- responsive ---------- */
@media (max-width:1240px){
  .nav{gap:20px}
  .ib.hide-l{display:none}
}
@media (max-width:900px){
  .hdr{padding:0 12px;height:64px;--hh:64px}
  .nav,.hide-m{display:none!important}
  .burger{display:grid}
  .burger svg{width:24px;height:24px}
  .av{width:44px;height:44px}
  #bellBtn svg{width:46px;height:46px}
  .app{grid-template-columns:minmax(0,1fr);padding:0 12px 24px;row-gap:12px}
  .panel{overflow:visible}
  .tabpanels{flex:none}
  .tabpanel{position:static;overflow:visible}
  .semi{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fab{right:10px;bottom:10px;width:72px;height:68px}
  .chat{right:12px;bottom:88px}
  .mini{left:12px;bottom:12px;width:calc(100vw - 104px);height:60px;gap:8px;padding:0 10px 0 6px}
  .mini .mth{width:46px;height:46px}
  .mini .mt{display:none}
  .map-head,.map-prog{left:12px;right:12px}
  .map-prog{bottom:96px}
  .map-cover{left:12px;width:min(46vw,34vh);top:22%}
  .strip{margin-left:calc(min(46vw,34vh) * .5 + 12px);height:clamp(260px,46vh,420px)}
  .strip-wrap{top:58%}
  .eps,.foot{padding-left:12px;padding-right:12px}
  .foot-art{margin:0 -12px}
}
@media (max-width:600px){
  .ctl-row #shareBtn{--x:790}
  .stage #speed{--x:770}
  .row-main .rb{right:64px}
  .row .liked{right:52px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .card{aspect-ratio:1/1.02}
  .ttl .dv{margin-bottom:32px}
  .ttl .t1{margin-bottom:30px}
  .mk .mb{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:.01ms!important;animation:none!important}
  .strip-wrap{overflow-x:auto;scrollbar-width:thin}
  .map{height:auto;min-height:100svh}
}
</style>

      if (S.loop) { S.t -= DUR; addSpike(); }

function drawWave(Aamp, pl) {
  const t = S.tau;

  elm.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    drag = true; elm.setPointerCapture(e.pointerId); elm.classList.add('drag'); elm.focus({ preventScroll: true });
    seek(frac(e.clientX) * DUR, { spike: false }); showTip(e.clientX); e.preventDefault();
  });
  elm.addEventListener('pointermove', e => { if (drag) seek(frac(e.clientX) * DUR, { spike: false }); if (e.pointerType === 'mouse' || drag) showTip(e.clientX); });
  const end = () => { if (!drag) return; drag = false; elm.classList.remove('drag'); addSpike(); if (S.playing) S.kick = Math.max(S.kick, 0.45); };
  elm.addEventListener('pointerup', end); elm.addEventListener('pointercancel', end);
  elm.addEventListener('lostpointercapture', () => { end(); if (tip) elm.classList.remove('tipon'); });
  elm.addEventListener('pointerleave', () => { if (!drag && tip) elm.classList.remove('tipon'); });
  elm.addEventListener('keydown', e => {
    const m = { ArrowRight: 5, ArrowUp: 5, ArrowLeft: -5, ArrowDown: -5, PageUp: 15, PageDown: -15 }[e.key];
    if (m !== undefined) { seek(S.t + m); e.preventDefault(); }
    else if (e.key === 'Home') { seek(0); e.preventDefault(); }
    else if (e.key === 'End') { seek(DUR - 1); e.preventDefault(); }
  });
}
bindSeek(seekEl, 14 / 746, true);
bindSeek(miniSeek, 0, false);

/* speed dial: click = next step, drag = turn, arrow keys */
(() => {
  const k = q('#speed');
  let down = null, moved = false;
  const stepFrom = (x, y) => {
    const r = k.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let a = Math.atan2(x - cx, cy - y) * 180 / Math.PI;
    return clamp(Math.round((clamp(a, -150, 150) + 135) / 45), 0, SPEEDS.length - 1);
  };
  k.addEventListener('pointerdown', e => { if (e.button !== 0) return; down = { x: e.clientX, y: e.clientY }; moved = false; k.setPointerCapture(e.pointerId); k.classList.add('drag'); k.focus({ preventScroll: true }); e.preventDefault(); });
  k.addEventListener('pointermove', e => { if (!down) return; if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) moved = true; if (moved) setSpeed(stepFrom(e.clientX, e.clientY)); });
  const up = () => { if (!down) return; if (!moved) setSpeed((S.si + 1) % SPEEDS.length); down = null; k.classList.remove('drag'); };
  k.addEventListener('pointerup', up); k.addEventListener('pointercancel', () => { down = null; k.classList.remove('drag'); });
  k.addEventListener('keydown', e => {
    const m = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
    if (m) { setSpeed(S.si + m); e.preventDefault(); }
    else if (e.key === 'Home') { setSpeed(0); e.preventDefault(); }
    else if (e.key === 'End') { setSpeed(SPEEDS.length - 1); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === ' ') { setSpeed((S.si + 1) % SPEEDS.length); e.preventDefault(); }
  });
})();

/* chapters / transcript tabs */
const tabs = [q('#tabCh'), q('#tabTr')], pans = [q('#pnCh'), pnTr], dots = [q('#dotCh'), q('#dotTr')], panel = q('#panel');
let tabI = 0;
function setTab(i, focus) {
  if (i === tabI) { if (focus) tabs[i].focus(); return; }
  tabI = i;
  tabs.forEach((t, j) => { t.setAttribute('aria-selected', String(j === i)); t.tabIndex = j === i ? 0 : -1; });
  dots.forEach((d, j) => d.setAttribute('aria-pressed', String(j === i)));
  pans.forEach((p, j) => { p.hidden = j !== i; });
  panel.classList.toggle('tr', i === 1);
  if (focus) tabs[i].focus();
  if (!RM) {
    const items = i === 0 ? rowEls : [...paraEls, q('.ttl', pnTr)];
    gsap.fromTo(items, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.42, stagger: 0.035, ease: 'power2.out', overwrite: true, clearProps: 'transform,opacity' });
  }
  if (i === 1) { curPara = -1; syncPanel(true); }
}
tabs.forEach((t, i) => {
  t.addEventListener('click', () => setTab(i));
  t.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { setTab(1 - tabI, true); e.preventDefault(); }
    else if (e.key === 'Home') { setTab(0, true); e.preventDefault(); }
    else if (e.key === 'End') { setTab(1, true); e.preventDefault(); }
  });
});
dots.forEach((d, i) => d.addEventListener('click', () => setTab(i)));
qa('a[data-tab="tr"]').forEach(a => a.addEventListener('click', () => setTab(1)));

/* chapters: click = go to the chapter and play */
rowEls.forEach((r, i) => {
  q('.row-main', r).addEventListener('click', () => { seek(i * CH); setPlaying(true); });
  qa('[data-act]', r).forEach(b => b.addEventListener('click', () => {
    const act = b.dataset.act;
    closePop(true);
    if (act === 'like') {
      const on = !r.classList.contains('is-liked');
      r.classList.toggle('is-liked', on);
      q('.lbl', b).textContent = on ? 'Unlike' : 'Like';
      if (on && !RM) gsap.fromTo(q('.liked', r), { scale: 0 }, { scale: 1, duration: 0.5, ease: 'back.out(3)', clearProps: 'transform' });
      toast(on ? 'Chapter liked' : 'Like removed', on ? 'heartf' : 'heart');
    } else if (act === 'queue') toast('Added to queue', 'plus');
    else copyLink();
  }));
});

/* transcript: click on a timestamp = jump */
paraEls.forEach((p, k) => {
  p.addEventListener('pointermove', e => { const r = p.getBoundingClientRect(); p.style.setProperty('--cx', clamp(e.clientX - r.left, 50, r.width - 50) + 'px'); });
  p.addEventListener('click', e => {
    const r = p.getBoundingClientRect();
    const f = e.detail === 0 ? 0 : clamp((e.clientX - r.left) / r.width, 0, 0.98);
    seek(k * PL + f * PL);
    if (!RM) gsap.fromTo(q('.ring', p), { opacity: 1 }, { opacity: 0, duration: 1.2, delay: 0.5, ease: 'power2.in' });
  });
});

/* episode map: clickable markers */
qa('.mk button').forEach(b => b.addEventListener('click', () => { seek(+b.dataset.ch * CH); setPlaying(true); toast('Playing chapter ' + (+b.dataset.ch + 1), 'play'); }));

/* episode cards: they flip */
qa('.card').forEach(card => {
  const fb = q('.flip', card), front = q('.front', card), back = q('.back', card);
  const flip = on => {
    card.classList.toggle('flipped', on);
    fb.setAttribute('aria-expanded', String(on));
    front.inert = on; back.inert = !on;
    setTimeout(() => (on ? q('.rb2', back) : fb).focus({ preventScroll: true }), RM ? 0 : 380);
  };
  fb.addEventListener('click', () => flip(true));
  q('.flipback', card).addEventListener('click', () => flip(false));
  q('.pl', card).addEventListener('click', () => playTrack(1 + qa('.card').indexOf(card)));
  card.addEventListener('keydown', e => { if (e.key === 'Escape' && card.classList.contains('flipped')) { flip(false); e.stopPropagation(); } });
  q('.lk', card).addEventListener('click', e => { const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on)); q('use', b).setAttribute('href', on ? '#i-heartf' : '#i-heart'); if (on && !RM) gsap.fromTo(b, { scale: 0.8 }, { scale: 1, duration: 0.45, ease: 'back.out(3)', clearProps: 'transform' }); toast(on ? 'Liked' : 'Like removed', on ? 'heartf' : 'heart'); });
  q('.q', card).addEventListener('click', e => { const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on)); toast(on ? 'Added to queue' : 'Removed from queue', on ? 'plus' : 'x'); });
});
qa('.follow').forEach(b => b.addEventListener('click', () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on)); if (!RM) gsap.fromTo(b, { scale: 0.85 }, { scale: 1, duration: 0.45, ease: 'back.out(3)', clearProps: 'transform' }); toast(on ? 'Following' : 'Unfollowed', on ? 'check' : 'x'); }));

/* ================= panels, menus, chat ================= */
let cur = null;
function openPop(btn, pop, viaKey) {
  if (cur && cur.pop === pop) { closePop(); return; }
  closePop();
  pop.hidden = false; btn.setAttribute('aria-expanded', 'true');
  if (btn.id === 'menuBtn') btn.setAttribute('aria-label', 'Close menu');
  if (btn.id === 'fab') btn.setAttribute('aria-label', 'Close live chat');
  cur = { btn, pop };
  if (!RM) gsap.fromTo(pop, { opacity: 0, y: pop.id === 'chat' ? 14 : -6, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.24, ease: 'power2.out', clearProps: 'transform,opacity' });
  if (pop.id === 'bellPop') clearBadge();
  if (pop.id === 'chat') q('#msgs').scrollTop = 1e5;
  if (viaKey) { const f = pop.querySelector('a,button,[tabindex="0"]'); if (f) f.focus(); }
}
function closePop(ret) {
  if (!cur) return;
  const { btn, pop } = cur; cur = null;
  pop.hidden = true; btn.setAttribute('aria-expanded', 'false');
  if (btn.id === 'menuBtn') btn.setAttribute('aria-label', 'Open menu');
  if (btn.id === 'fab') btn.setAttribute('aria-label', 'Open live chat');
  if (ret) btn.focus();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-pop]');
  if (b) { openPop(b, document.getElementById(b.dataset.pop), e.detail === 0); return; }
  if (cur && !cur.pop.contains(e.target)) closePop();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && cur) { closePop(true); return; }
  if (cur && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && cur.pop.contains(document.activeElement)) {
    const items = qa('a,button', cur.pop), i = items.indexOf(document.activeElement);
    const n = items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length];
    if (n) { n.focus(); e.preventDefault(); }
  }
});
qa('#mnav a, #avPop a').forEach(a => a.addEventListener('click', () => closePop()));
q('#chatClose').addEventListener('click', () => closePop(true));
qa('#inboxPop .it').forEach(b => b.addEventListener('click', () => { b.classList.add('read'); b.setAttribute('aria-label', b.getAttribute('aria-label').replace(', unread', '')); }));
qa('#bellPop .it').forEach(b => b.addEventListener('click', () => { b.classList.add('read'); closePop(true); }));
let badge = true;
function clearBadge() {
  if (!badge) return; badge = false;
  q('#bellBtn').setAttribute('aria-label', 'Notifications');
  gsap.to('#badge', { scale: 0, svgOrigin: '1605 62', duration: RM ? 0 : 0.35, ease: 'back.in(2)', overwrite: true });
}

/* live chat */
const msgs = q('#msgs');
function addMsg(me, th, lens, icon) {
  const d = document.createElement('div');
  d.className = 'msg' + (me ? ' me' : '');
  d.innerHTML = (me ? '' : THUMB(th)) + `<div class="bb">${icon ? `<svg class="rx" viewBox="${icon[1]}" aria-hidden="true" focusable="false" style="color:${icon[2]}"><use href="#${icon[0]}"/></svg>` : lens.map(w => `<i style="width:${w}px"></i>`).join('')}</div>`;
  if (icon) d.insertAdjacentHTML('beforeend', `<span class="sr-only">You sent a ${icon[3]}</span>`);
  else d.setAttribute('aria-hidden', 'true');
  msgs.appendChild(d);
  return d;
}
addMsg(false, 'a', [150, 90]); addMsg(false, 'c', [120, 170, 60]); addMsg(true, '', [130, 80]); addMsg(false, 'b', [100]);
const RX = { heart: ['i-heartf', '0 0 44 38', C.coral, 'heart'], wave: ['i-wave', '0 0 24 24', C.ink, 'wave'], sun: ['i-sun', '0 0 24 24', C.ink, 'sun'] };
qa('.react').forEach(b => b.addEventListener('click', () => {
  const n = q('.n', b), v = +n.textContent + 1, r = RX[b.dataset.r];
  n.textContent = v;
  b.setAttribute('aria-label', `Send a ${r[3]}, ${v} sent`);
  if (!RM) gsap.fromTo(n, { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: 'back.out(3)', clearProps: 'transform,opacity' });
  const m = addMsg(true, '', null, [r[0], r[1], r[2] === C.coral ? C.ink : r[2], r[3]]);
  if (!RM) gsap.from(m, { scale: 0.6, opacity: 0, transformOrigin: '100% 100%', duration: 0.4, ease: 'back.out(2.4)' });
  msgs.scrollTop = 1e5;
}));

/* small confirmation message */
const toastEl = q('#toast'), toastTxt = q('#toastTxt'), toastIco = q('#toastIco');
let toastTl = null;
function toast(txt, icon) {
  toastTxt.textContent = txt;
  toastIco.setAttribute('href', '#i-' + icon);
  toastIco.parentNode.setAttribute('viewBox', icon.startsWith('heart') ? '0 0 44 38' : '0 0 24 24');
  if (toastTl) toastTl.kill();
  toastTl = gsap.timeline()
    .to(toastEl, { y: 0, opacity: 1, duration: RM ? 0 : 0.3, ease: 'back.out(2)' })
    .to(toastEl, { opacity: 0, y: -90, duration: RM ? 0 : 0.35, ease: 'power2.in' }, '+=1.5');
}
gsap.set(toastEl, { xPercent: -50, x: 0, y: -90, opacity: 0 });

/* ================= scrolling (ScrollTrigger) ================= */
const heroIO = new IntersectionObserver(es => es.forEach(e => { heroVis = e.isIntersecting; }), { rootMargin: '80px' });
heroIO.observe(q('#player'));
const mapIO = new IntersectionObserver(es => es.forEach(e => { mapVis = e.isIntersecting; }), { rootMargin: '80px' });
mapIO.observe(q('#map'));
const mini = q('#mini');
function setMini(on) { if (on === miniOn) return; miniOn = on; mini.classList.toggle('on', on); mini.inert = !on; }
ScrollTrigger.create({ trigger: '#player', start: 'bottom 45%', onEnter: () => setMini(true), onLeaveBack: () => setMini(false) });
if (q('#player').getBoundingClientRect().bottom < innerHeight * 0.45) setMini(true);

let mapST = null;
const stripWrap = q('#stripWrap');
const stripDist = () => Math.max(0, strip.offsetWidth + parseFloat(getComputedStyle(strip).marginLeft) - stripWrap.clientWidth + 60);

const mm = gsap.matchMedia();
mm.add('(prefers-reduced-motion: no-preference)', () => {
  // map: pinned section, the long waveform scrolls horizontally, the cover spins
  const tl = gsap.timeline({
    defaults: { ease: 'none' },
    scrollTrigger: { trigger: '#map', start: 'top top', end: () => '+=' + Math.max(stripDist(), innerHeight * 0.8), pin: true, scrub: 0.6, invalidateOnRefresh: true, anticipatePin: 1 }
  });
  tl.to(strip, { x: () => -stripDist() }, 0)
    .to('#mapArt', { rotation: 360, transformOrigin: '50% 50%' }, 0)
    .fromTo('#mapDisc', { xPercent: 0, yPercent: 0 }, { xPercent: -60, yPercent: -40 }, 0)
    .fromTo('#mapDisc2', { xPercent: 0, yPercent: 0 }, { xPercent: 120, yPercent: 220 }, 0)
    .to(mapFill, { scaleX: 1 }, 0);
  mapST = tl.scrollTrigger;
  gsap.from('.map-head', { y: 30, opacity: 0, duration: 0.7, ease: 'power3.out', scrollTrigger: { trigger: '#map', start: 'top 75%', once: true } });
  gsap.from('.map-cover .mc-in', { scale: 0.7, opacity: 0, duration: 0.9, ease: 'back.out(1.6)', scrollTrigger: { trigger: '#map', start: 'top 70%', once: true } });

  // elements entering the screen
  qa('[data-reveal]').forEach(e => gsap.from(e, { y: 46, opacity: 0, duration: 0.8, ease: 'power3.out', scrollTrigger: { trigger: e, start: 'top 88%', once: true } }));
  gsap.set('[data-reveal-card]', { y: 80, opacity: 0 });
  ScrollTrigger.batch('[data-reveal-card]', { start: 'top 92%', once: true, onEnter: b => gsap.to(b, { y: 0, opacity: 1, duration: 0.8, stagger: 0.09, ease: 'power3.out' }) });
  qa('.card svg.ca').forEach((s, i) => gsap.fromTo(s, { rotation: -20 + i * 6 }, { rotation: 20 - i * 4, ease: 'none', scrollTrigger: { trigger: s, start: 'top bottom', end: 'bottom top', scrub: 0.8 } }));

  // footer: the big half-circle rises with the scroll
  gsap.fromTo('#semiBig', { scaleY: 0.12, scaleX: 0.7 }, { scaleY: 1, scaleX: 1, ease: 'none', scrollTrigger: { trigger: '.foot-art', start: 'top bottom', end: 'bottom bottom', scrub: 0.6 } });
  gsap.fromTo('#cdot', { y: 200, scale: 0.4 }, { y: 0, scale: 1, ease: 'none', scrollTrigger: { trigger: '.foot-art', start: 'top bottom', end: 'bottom bottom', scrub: 0.8 } });
  gsap.fromTo('#cdot2', { y: 160 }, { y: 0, ease: 'none', scrollTrigger: { trigger: '.foot-art', start: 'top bottom', end: 'bottom bottom', scrub: 1 } });
  // the player's teal disc slides a little when leaving the top of the page
  gsap.to('.stage', { yPercent: -3, ease: 'none', scrollTrigger: { trigger: '#player', start: 'top top', end: 'bottom top', scrub: 0.5 } });

  // small ambient animations
  const amb = [
    gsap.to('#fabBub', { y: -5, duration: 1.1, ease: 'sine.inOut', yoyo: true, repeat: -1 }),
    gsap.to('#chatLive', { scale: 1.35, opacity: 0.55, duration: 0.8, ease: 'sine.inOut', yoyo: true, repeat: -1 }),
    gsap.to('#cdot', { yPercent: -12, duration: 0.9, ease: 'sine.inOut', yoyo: true, repeat: -1 }),
    gsap.to('#badge', { scale: 1.12, svgOrigin: '1605 62', duration: 0.7, ease: 'sine.inOut', yoyo: true, repeat: -1 })
  ];
  return () => { mapST = null; amb.forEach(a => a.kill()); };
});

// a chapter marker that gets keyboard focus is scrolled into view
qa('.mk button').forEach((b, i) => b.addEventListener('focus', () => {
  if (mapST) {
    const y = mapST.start + (mapST.end - mapST.start) * clamp(i / NCH - 0.05);
    if (Math.abs(scrollY - y) > 4) window.scrollTo({ top: y, behavior: 'auto' });
  } else {
    const m = mkEls[i]; stripWrap.scrollLeft = Math.max(0, m.offsetLeft - 60);
  }
}));

/* ================= initial state ================= */
setSpeed(2, { wig: false });
syncPanel(true);
const tlInit = () => { ScrollTrigger.refresh(); document.documentElement.dataset.ready = '1'; };
if (document.fonts && document.fonts.ready) document.fonts.ready.then(tlInit); else tlInit();
window.podcast = { state: S, seek, setPlaying, setSpeed, setTab };
})();
</script>
</body>
</html>
