<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WAVES FEST</title>
<meta name="description" content="WAVES FEST music festival: the poster, an interactive festival map from day to night, and tickets.">
<meta name="theme-color" content="#efebd8">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=block&text=WAVESFTMPICK0123456789" rel="stylesheet">
<style>
  :root{
    --cream:#efebd8;--paper:#fbf8ee;--orange:#e56707;--pink:#e3929f;--blue:#0078ba;--ink:#16323a;--gray:#bfbbaa;
    --u:calc(100vw / 1920);--su:max(var(--u), .56px);
    --nav:#16323a;--pill:#0078ba;--chat:#0078ba;
    --lg1:#16323a;--lg2:#16323a;--lg3:#0078ba;--lg4:#16323a;--lg5:#e56707;--lg6:#e56707;--lg7:#0078ba;--lg8:#16323a;--lg9:#0078ba;
    --sky:#e595a0;--ground:#e594a1;--path:#efebd8;--cloud:#efecdb;--hA:#0079b6;--hB:#006e88;--hC:#003b49;--hD:#066b90;
    --door:#0877b6;--arch:#1f7cc4;--arch2:#5aadde;--ringL:#0a7ac0;--ringR:#0a7ac0;--win:#0b5c55;--lamp:#12384a;
  }
  *{box-sizing:border-box}
  html{background:var(--cream);scrollbar-width:none;-webkit-text-size-adjust:100%}
  html::-webkit-scrollbar{display:none}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Outfit',system-ui,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
  .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  a,button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
  button{background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
  a{text-decoration:none;touch-action:manipulation}
  [inert]{pointer-events:none!important}
  :focus{outline:none}
  :focus-visible{outline:3px solid var(--ink);outline-offset:4px}
  svg text{font-family:'Outfit',sans-serif}

  /* ---------- nav bar (1920 px drawing, scaled) ---------- */
  .nav{position:fixed;left:0;top:0;width:100%;height:calc(128 * var(--u));z-index:60;pointer-events:none}
  .nav > *{position:absolute;pointer-events:auto}
  .nav :focus-visible{outline-color:var(--nav)}
  .logo{left:calc(30 * var(--u));top:calc(26 * var(--u));width:calc(200 * var(--u));height:calc(108 * var(--u));border-radius:10px}
  .logo svg{width:100%;height:100%;display:block;overflow:visible}
  .navtxt{position:relative;font-weight:600;font-size:calc(27 * var(--u));line-height:1;color:var(--nav);white-space:nowrap;transition:color .15s}
  .nav-map{left:calc(250 * var(--u));top:calc(17 * var(--u));width:calc(137 * var(--u));height:calc(94 * var(--u));border-radius:calc(26 * var(--u));display:grid;place-items:center}
  .nav-map .hov{position:absolute;inset:0;border-radius:inherit;background:#b3c4ce;opacity:0;transition:opacity .15s}
  .nav-map:hover .hov,.nav-map:focus-visible .hov{opacity:1}
  .nav-map:active .navtxt{transform:scale(.94)}
  .nav-tk{left:calc(916 * var(--u));top:calc(40 * var(--u));width:calc(121 * var(--u));height:calc(50 * var(--u));display:grid;place-items:center;border-radius:12px}
  .nav-tk:hover .navtxt{color:var(--orange)}
  .nbar{top:calc(40 * var(--u));height:calc(48 * var(--u));display:flex;align-items:center;padding:0 calc(10 * var(--u));border-radius:12px}
  .nbar i{display:block;width:100%;height:calc(8 * var(--u));min-height:3px;border-radius:99px;background:var(--nav);transition:background .15s,transform .15s}
  .nbar:hover i{background:var(--orange)}
  .nbar:active i{transform:scaleX(.92)}
  .nb1{left:calc(1070 * var(--u));width:calc(83 * var(--u))}
  .nb2{left:calc(1187 * var(--u));width:calc(86 * var(--u))}
  .nb3{left:calc(1307 * var(--u));width:calc(154 * var(--u))}
  .nb4{left:calc(1494 * var(--u));width:calc(91 * var(--u))}
  .avatar{left:calc(1629 * var(--u));top:calc(38 * var(--u));width:calc(52 * var(--u));height:calc(52 * var(--u));border-radius:50%;transition:transform .12s}
  .avatar svg{width:100%;height:100%;display:block}
  .avatar:active{transform:scale(.92)}
  .pill{left:calc(1707 * var(--u));top:calc(32 * var(--u));width:calc(173 * var(--u));height:calc(65 * var(--u));border-radius:999px;display:grid;place-items:center;transition:transform .12s}
  .pill::before{content:'';position:absolute;inset:calc(-9 * var(--u));border-radius:999px;background:#d6d1c0;opacity:0;transition:opacity .12s}
  .pill:active::before{opacity:1}
  .pill:active{transform:scale(.95)}
  .pill .bg{position:absolute;inset:0;border-radius:inherit;background:var(--pill)}
  .pill:hover .bg{filter:brightness(1.08)}
  .pill .navtxt{color:#fbf3e6}
  .pill:focus-visible{outline-color:var(--ink)}
  .badge{position:absolute;right:calc(-8 * var(--u));top:calc(-8 * var(--u));min-width:max(calc(30 * var(--u)), 19px);height:max(calc(30 * var(--u)), 19px);padding:0 5px;border-radius:99px;background:var(--pink);color:var(--ink);font-weight:700;font-size:max(calc(17 * var(--u)),11px);line-height:1;display:grid;place-items:center;transform:scale(0)}
  .menu-btn{display:none;right:10px;top:10px;width:44px;height:44px;border-radius:12px;place-items:center}
  .menu-btn i{position:absolute;left:10px;width:24px;height:3.5px;border-radius:3px;background:var(--nav);transition:transform .25s,opacity .2s}
  .menu-btn i:nth-child(1){top:13px}.menu-btn i:nth-child(2){top:20.25px}.menu-btn i:nth-child(3){top:27.5px}
  .menu-btn[aria-expanded="true"] i:nth-child(1){transform:translateY(7.25px) rotate(45deg)}
  .menu-btn[aria-expanded="true"] i:nth-child(2){opacity:0}
  .menu-btn[aria-expanded="true"] i:nth-child(3){transform:translateY(-7.25px) rotate(-45deg)}

  /* ---------- panels: cart (avatar) and mobile menu ---------- */
  .panel{position:fixed;z-index:70;background:var(--paper);border-radius:22px;padding:18px;color:var(--ink)}
  .panel[hidden]{display:none}
  .acct{top:calc(112 * var(--u));right:calc(36 * var(--u));width:340px}
  .acct-head{display:flex;align-items:center;gap:12px;padding:2px 2px 14px}
  .acct-head svg{width:44px;height:44px;flex:none}
  .acct-head .bars{flex:1;display:grid;gap:8px}
  .acct-head .bars i,.mbar i{display:block;height:8px;border-radius:99px;background:var(--ink)}
  .lbl{font-weight:700;font-size:15px;letter-spacing:.02em;margin:6px 2px 10px;color:var(--ink)}
  .cart{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:260px;overflow:auto}
  .cart li{display:flex;align-items:center;gap:10px;background:var(--cream);border-radius:14px;padding:8px 8px 8px 10px}
  .cart li svg.mini{width:120px;height:44px;flex:none}
  .cart li .grow{flex:1;display:grid;gap:6px}
  .cart li .grow i{display:block;height:6px;border-radius:99px;background:var(--gray)}
  .rm{width:36px;height:36px;border-radius:50%;background:var(--paper);display:grid;place-items:center;flex:none;transition:transform .12s,background .15s}
  .rm:hover{background:var(--pink)}
  .rm:active{transform:scale(.9)}
  .rm svg{width:14px;height:14px}
  .empty{display:flex;align-items:center;gap:12px;padding:8px 2px}
  .empty svg{width:120px;height:44px;flex:none}
  .cta{display:inline-grid;place-items:center;height:46px;padding:0 22px;border-radius:999px;background:var(--orange);color:#fbf3e6;font-weight:700;font-size:17px;transition:transform .12s}
  .cta:active{transform:scale(.95)}
  .panel .cta{margin-top:14px;width:100%}
  .menu{top:68px;left:8px;right:8px;padding:14px 18px 20px}
  .menu nav{display:grid;gap:2px}
  .mlink{display:flex;align-items:center;height:52px;font-weight:700;font-size:28px;border-radius:12px;padding:0 6px}
  .mlink:active{transform:scale(.98)}
  .mbar{display:flex;align-items:center;height:40px;padding:0 6px;border-radius:12px}
  .mbar i{height:10px}
  .menu .lbl{margin-top:16px}

  /* ---------- pinned scene ---------- */
  #festival{position:relative;height:100vh;height:100svh}
  #stage{position:relative;width:100%;height:100vh;height:100svh;overflow:hidden;background:var(--cream)}
  #wrap{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
  .layer{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
  #world{perspective:2600px;perspective-origin:960px 540px}
  .sheet{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-style:preserve-3d;transform-origin:960px 540px}
  .pnl{position:absolute;top:0;height:1080px;width:640px;transform-style:preserve-3d}
  .pnl.l{left:0;transform-origin:100% 50%}
  .pnl.c{left:640px}
  .pnl.r{left:1280px;transform-origin:0 50%}
  .face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .face svg{position:absolute;top:0;width:1920px;height:1080px;display:block}
  .back{transform:rotateY(180deg);background:#e3929f}
  .sheet.flat .pnl.l,.sheet.flat .pnl.r{display:none}
  .sheet.flat .pnl.c{left:0;width:1920px}
  .sheet.flat .pnl.c .face svg{left:0 !important}
  svg{overflow:hidden}
  #stage{touch-action:pan-y}
  #stage button,#stage a{touch-action:pan-y}
  #stage.panning{cursor:grabbing}

  /* interactive elements placed on the drawing (1920 x 1080 coordinates) */
  #sceneUI > *{position:absolute}
  .hit{pointer-events:auto;cursor:pointer}
  #sceneUI :focus-visible{outline-width:5px;outline-offset:6px}
  #posterTk{left:820px;top:792px;width:276px;height:78px;border-radius:16px}
  #posterTk::after{content:'';position:absolute;left:28px;right:28px;bottom:2px;height:7px;border-radius:4px;background:var(--orange);transform:scaleX(0);transform-origin:left;transition:transform .25s}
  #posterTk:hover::after,#posterTk:focus-visible::after{transform:scaleX(1)}
  #stageZone{left:0;top:0;width:0;height:0}
  #stageZone > *{position:absolute}
  #stageBtn{left:690px;top:340px;width:540px;height:262px;border-radius:26px}
  #card{left:745px;top:150px;width:427px;height:258px;visibility:hidden;opacity:0}
  #card > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .card-tk{position:absolute;left:20px;top:26px;width:150px;height:48px;border-radius:10px}
  .card-tk::after{content:'';position:absolute;left:9px;width:128px;bottom:2px;height:5px;border-radius:3px;background:var(--orange);transform:scaleX(0);transform-origin:left;transition:transform .2s}
  .card-tk:hover::after,.card-tk:focus-visible::after{transform:scaleX(1)}
  .card-play{position:absolute;left:341px;top:151px;width:58px;height:58px;border-radius:50%}
  .card-play svg,#playBtn svg{width:100%;height:100%;display:block;overflow:visible;transition:transform .12s}
  .card-play:active svg,#playBtn:active svg{transform:scale(.88)}
  #playBtn{left:914px;top:422px;width:92px;height:92px;border-radius:50%;visibility:hidden;opacity:0}
  .i-pause{display:none}
  [aria-pressed="true"] .i-pause{display:inline}
  [aria-pressed="true"] .i-play{display:none}
  #playBtn[aria-pressed="true"] .pc{fill:#fbf8ee}
  #playBtn[aria-pressed="true"] .pi{fill:#0078ba}
  .card-play .i-pause{fill:#fbf8ee}

  /* ---------- ticket ---------- */
  #tkLayer{position:absolute;inset:0;visibility:hidden;pointer-events:none;z-index:3}
  #tkBox{position:absolute}
  #tkEnter,#tkFlip{position:absolute;inset:0;transform-style:preserve-3d}
  .tk-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .tk-back{transform:rotateY(180deg)}
  .tk-face > svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
  .tk-flipbtn{position:absolute;pointer-events:auto;border-radius:18px;cursor:pointer}
  .tk-add{position:absolute;pointer-events:auto;border-radius:999px;transition:transform .12s}
  .tk-add svg{width:100%;height:100%;display:block}
  .tk-add:hover rect{fill:#f07a1f}
  .tk-add:active{transform:scale(.94)}
  .tk-land .tk-flipbtn{left:.67%;top:1.41%;width:88.55%;height:74.65%}
  .tk-land .tk-add{left:63.43%;top:57.32%;width:21.08%;height:12.11%}
  .tk-port .tk-flipbtn{left:2.86%;top:1.69%;width:85.71%;height:91.53%}
  .tk-port .tk-add{left:23.36%;top:83.39%;width:44.71%;height:7.29%}

  /* ---------- day / night slider ---------- */
  .tod{position:absolute;left:0;right:0;margin:0 auto;bottom:calc(35 * var(--su));width:calc(794 * var(--su));height:calc(82 * var(--su));background:var(--paper);border-radius:calc(24 * var(--su));display:grid;grid-template-columns:calc(20 * var(--su)) calc(64 * var(--su)) calc(43 * var(--su)) 1fr calc(39 * var(--su)) calc(64 * var(--su)) calc(16 * var(--su));align-items:center;z-index:5;visibility:hidden}
  .tod-ic{width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;transition:transform .12s,background .15s}
  .tod-ic:hover{background:#efe9d6}
  .tod-ic:active{transform:scale(.9)}
  .tod-ic svg{width:62%;height:62%;overflow:visible}
  .tod-sun{grid-column:2}.tod-moon{grid-column:6}
  .tod-track{grid-column:4;position:relative;height:100%;cursor:pointer;touch-action:none;border-radius:12px}
  .tod-track::before{content:'';position:absolute;left:0;right:0;top:50%;height:calc(6 * var(--su));min-height:4px;transform:translateY(-50%);border-radius:3px;background:#ddd8c8}
  .tod-fill{position:absolute;left:0;top:50%;height:calc(6 * var(--su));min-height:4px;transform:translateY(-50%);border-radius:3px;background:var(--blue);width:0}
  .tod-knob{position:absolute;top:50%;left:0;width:calc(44 * var(--su));height:calc(44 * var(--su));min-width:28px;min-height:28px;margin:0;transform:translate(-50%,-50%);border-radius:50%;background:var(--blue);border:calc(3 * var(--su)) solid var(--paper);transition:transform .12s}
  .tod-track.drag .tod-knob{transform:translate(-50%,-50%) scale(1.14)}
  .tod-track:focus-visible{outline-offset:2px}

  /* ---------- heart bubble ---------- */
  .chat{position:fixed;z-index:50;right:calc(38 * var(--u));bottom:calc(30 * var(--u));width:max(calc(100 * var(--u)),58px);height:max(calc(104 * var(--u)),60px);border-radius:50%}
  .chat svg{width:100%;height:100%;display:block;overflow:visible;transition:transform .12s}
  .chat:active svg{transform:scale(.92)}
  .heart{transition:fill .2s}
  .chat[aria-pressed="true"] .heart{fill:var(--pink)}
  .fly{position:fixed;left:0;top:0;width:60px;height:30px;z-index:90;pointer-events:none}

  /* ---------- mobile ---------- */
  @media (max-width:820px){
    .nav{height:64px}
    .logo{left:12px;top:7px;width:92px;height:50px}
    .nav-map{left:112px;top:10px;width:62px;height:44px;border-radius:14px}
    .navtxt{font-size:16px}
    .nav-tk,.nbar,.avatar{display:none}
    .pill{left:auto;right:62px;top:12px;width:108px;height:40px}
    .pill .navtxt{font-size:15px}
    .badge{right:-6px;top:-6px}
    .menu-btn{display:grid}
    .acct{display:none!important}
    .tod{left:12px;right:84px;margin:0;width:auto;height:60px;bottom:max(16px, env(safe-area-inset-bottom));border-radius:20px;grid-template-columns:6px 44px 10px 1fr 12px 44px 6px}
    .tod-knob{width:30px;height:30px;border-width:3px}
    .chat{right:12px;bottom:max(14px, env(safe-area-inset-bottom));width:62px;height:64px}
  }
  @media (min-width:821px){ .menu{display:none!important} }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition-duration:0s!important}
  }
</style>
</head>
<body>
<header class="nav" id="nav">
  <a class="logo ni" href="#top" data-goto="poster" aria-label="WAVES FEST, back to the poster">
    <svg viewBox="30 26 200 108" aria-hidden="true">
      <text x="40" y="80" font-size="57" font-weight="800" textLength="175" lengthAdjust="spacingAndGlyphs" letter-spacing="-1"><tspan style="fill:var(--lg1)">W</tspan><tspan style="fill:var(--lg2)">A</tspan><tspan style="fill:var(--lg3)">V</tspan><tspan style="fill:var(--lg4)">E</tspan><tspan style="fill:var(--lg5)">S</tspan></text>
      <text x="68" y="125" font-size="57" font-weight="800" textLength="124" lengthAdjust="spacingAndGlyphs" letter-spacing="-1"><tspan style="fill:var(--lg6)">F</tspan><tspan style="fill:var(--lg7)">E</tspan><tspan style="fill:var(--lg8)">S</tspan><tspan style="fill:var(--lg9)">T</tspan></text>
      <circle cx="219" cy="42" r="3.6" fill="none" style="stroke:var(--lg5)" stroke-width="1.4"/>
    </svg>
  </a>
  <a class="nav-map ni" href="#map" data-goto="map" aria-label="MAP, open the festival map"><span class="hov"></span><span class="navtxt">MAP</span></a>
  <a class="nav-tk ni" href="#tickets" data-goto="tickets" aria-label="TICKETS"><span class="navtxt">TICKETS</span></a>
  <a class="nbar nb1 ni" href="#top" data-goto="poster" aria-label="Lineup"><i></i></a>
  <a class="nbar nb2 ni" href="#map" data-goto="map" aria-label="Stages"><i></i></a>
  <a class="nbar nb3 ni" href="#tickets" data-goto="tickets" aria-label="Passes"><i></i></a>
  <a class="nbar nb4 ni" href="#finale" data-goto="finale" aria-label="About the festival"><i></i></a>
  <button class="avatar ni" id="avatarBtn" type="button" aria-label="Your account and cart" aria-expanded="false" aria-controls="acct">
    <svg viewBox="1629 38 52 52" aria-hidden="true"><defs><clipPath id="avClip"><circle cx="1655" cy="64" r="26"/></clipPath></defs>
      <g clip-path="url(#avClip)"><rect x="1625" y="34" width="60" height="60" fill="#8ec3e6"/>
        <path d="M1632,96C1634,80 1644,74 1655,74C1666,74 1676,80 1678,96Z" fill="#e56707"/>
        <rect x="1651" y="64" width="8" height="12" fill="#eab48f"/>
        <ellipse cx="1655" cy="58" rx="10.5" ry="12" fill="#eab48f"/>
        <path d="M1644,56C1643,44 1650,40 1656,40C1664,40 1668,46 1666,55C1662,49 1656,48 1650,50C1647,51 1646,54 1644,56Z" fill="#7a4a2a"/></g></svg>
  </button>
  <a class="pill ni" id="pill" href="#tickets" data-goto="tickets" aria-label="TICKETS"><span class="bg"></span><span class="navtxt">TICKETS</span><span class="badge" id="badge" aria-hidden="true">0</span></a>
  <button class="menu-btn ni" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu"><i></i><i></i><i></i></button>
</header>

<div class="panel acct" id="acct" hidden>
  <div class="acct-head"><svg viewBox="1629 38 52 52" aria-hidden="true"><g clip-path="url(#avClip)"><rect x="1625" y="34" width="60" height="60" fill="#8ec3e6"/><path d="M1632,96C1634,80 1644,74 1655,74C1666,74 1676,80 1678,96Z" fill="#e56707"/><rect x="1651" y="64" width="8" height="12" fill="#eab48f"/><ellipse cx="1655" cy="58" rx="10.5" ry="12" fill="#eab48f"/><path d="M1644,56C1643,44 1650,40 1656,40C1664,40 1668,46 1666,55C1662,49 1656,48 1650,50C1647,51 1646,54 1644,56Z" fill="#7a4a2a"/></g></svg>
    <div class="bars" aria-hidden="true"><i style="width:70%"></i><i style="width:45%;background:var(--gray)"></i></div></div>
  <p class="lbl" aria-hidden="true">TICKETS</p>
  <div class="cartbox" data-cart></div>
</div>

<div class="panel menu" id="menu" hidden>
  <nav aria-label="Mobile">
    <a class="mlink" href="#map" data-goto="map">MAP</a>
    <a class="mlink" href="#tickets" data-goto="tickets">TICKETS</a>
    <a class="mbar" href="#top" data-goto="poster" aria-label="Lineup"><i style="width:56%"></i></a>
    <a class="mbar" href="#map" data-goto="map" aria-label="Stages"><i style="width:40%"></i></a>
    <a class="mbar" href="#tickets" data-goto="tickets" aria-label="Passes"><i style="width:72%"></i></a>
    <a class="mbar" href="#finale" data-goto="finale" aria-label="About the festival"><i style="width:34%"></i></a>
  </nav>
  <p class="lbl" aria-hidden="true">TICKETS</p>
  <div class="cartbox" data-cart></div>
</div>

<main id="main">
  <h1 class="sr-only">WAVES FEST</h1>
  <section id="festival" aria-label="WAVES FEST: poster, festival map and tickets">
    <div id="stage">
      <div id="wrap">
        <div id="world" class="layer" aria-hidden="true">
          <div id="posterSheet" class="sheet"></div>
          <div id="mapSheet" class="sheet"></div>

function tPathLand(px, bigL, bigR) {
  const L = 300, Rr = 1615, T = 310, B = 840, rc = 16;
  const small = [345, 380, 415, 450, 485, 665, 700, 735, 770, 805];
  const bR = small.map(y => [y, 9]).concat([[575, bigR]]).sort((a, b) => a[0] - b[0]);
  const bL = small.map(y => [y, 9]).concat([[575, bigL]]).sort((a, b) => a[0] - b[0]);
  let d = `M${L + rc},${T}H${px - 30}A30,30 0 0 0 ${px + 30},${T}H${Rr - rc}Q${Rr},${T} ${Rr},${T + rc}`;
  for (const [cy, r] of bR) d += `V${cy - r}A${r},${r} 0 0 0 ${Rr},${cy + r}`;
  d += `V${B - rc}Q${Rr},${B} ${Rr - rc},${B}H${px + 30}A30,30 0 0 0 ${px - 30},${B}H${L + rc}Q${L},${B} ${L},${B - rc}`;
  for (const [cy, r] of bL.slice().reverse()) d += `V${cy + r}A${r},${r} 0 0 0 ${L},${cy - r}`;
  return d + `V${T + rc}Q${L},${T} ${L + rc},${T}Z`;
}
function tPathPort(py, bigT, bigB) {
  const L = 40, Rr = 640, T = 40, B = 1120, rc = 16;
  const small = [75, 110, 145, 180, 215, 465, 500, 535, 570, 605];
  const bT = small.map(x => [x, 9]).concat([[340, bigT]]).sort((a, b) => a[0] - b[0]);
  const bB = small.map(x => [x, 9]).concat([[340, bigB]]).sort((a, b) => a[0] - b[0]);
  let d = `M${L + rc},${T}`;
  for (const [cx, r] of bT) d += `H${cx - r}A${r},${r} 0 0 0 ${cx + r},${T}`;
  d += `H${Rr - rc}Q${Rr},${T} ${Rr},${T + rc}V${py - 30}A30,30 0 0 0 ${Rr},${py + 30}V${B - rc}Q${Rr},${B} ${Rr - rc},${B}`;
  for (const [cx, r] of bB.slice().reverse()) d += `H${cx + r}A${r},${r} 0 0 0 ${cx - r},${B}`;
  return d + `H${L + rc}Q${L},${B} ${L},${B - rc}V${py + 30}A30,30 0 0 0 ${L},${py - 30}V${T + rc}Q${L},${T} ${L + rc},${T}Z`;
}

  const html = cart
    ? `<ul class="cart">${Array.from({ length: cart }, (_, i) => `<li>${mini(i)}<span class="grow" aria-hidden="true"><i style="width:80%"></i><i style="width:50%"></i></span><button class="rm" type="button" data-rm="${i}" aria-label="Remove ticket ${i + 1}"><svg viewBox="-7 -7 14 14" aria-hidden="true"><path d="M-5,-5L5,5M5,-5L-5,5" stroke="${C.ink}" stroke-width="2.4" stroke-linecap="round"/></svg></button></li>`).join('')}</ul>`
    : `<div class="empty" aria-label="The cart is empty"><svg viewBox="0 0 120 44" aria-hidden="true"><rect x="2" y="2" width="116" height="40" rx="6" fill="none" stroke="#bfbbaa" stroke-width="2.5" stroke-dasharray="6 5"/></svg><span class="grow" aria-hidden="true" style="flex:1;display:grid;gap:6px"><i style="display:block;height:6px;width:70%;border-radius:9px;background:#bfbbaa"></i></span></div>`;
  document.querySelectorAll('[data-cart]').forEach(box => { box.innerHTML = html + `<a class="cta" href="#tickets" data-goto="tickets">TICKETS</a>`; });
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-rm]');
  if (!b) return;
  const panel = b.closest('.panel');
  cart = Math.max(0, cart - 1); renderCart(false);
  live.textContent = cart === 1 ? '1 ticket in the cart' : `${cart} tickets in the cart`;
  const nb = panel && panel.querySelector('.rm'); (nb || (panel && panel.querySelector('.cta')))?.focus({ preventScroll: true });
});
$('tkAdd').addEventListener('click', e => {
  const done = () => { cart++; renderCart(true); live.textContent = cart === 1 ? '1 ticket in the cart' : `${cart} tickets in the cart`; };
  if (RM) return done();
  const from = e.currentTarget.getBoundingClientRect(), to = pill.getBoundingClientRect();
  const fly = document.createElement('div'); fly.className = 'fly';
  fly.innerHTML = `<svg viewBox="0 0 60 30" width="60" height="30"><rect x="1" y="1" width="58" height="28" rx="4" fill="#f4f0e1" stroke="#a7a293" stroke-width="2"/><path d="M5,1H18V29H5Q1,29 1,25V5Q1,1 5,1Z" fill="${C.pink}"/><circle cx="30" cy="15" r="6" fill="${C.orange}"/><rect x="40" y="9" width="14" height="4" fill="${C.orange}"/><rect x="40" y="17" width="10" height="4" fill="${C.pink}"/></svg>`;
  document.body.appendChild(fly);
  const x0 = from.left + from.width / 2 - 30, y0 = from.top + from.height / 2 - 15, x1 = to.right - 30, y1 = to.top - 4;
  gsap.set(fly, { x: x0, y: y0, rotation: -12, scale: 1.2 });
  gsap.timeline({ onComplete: () => { fly.remove(); done(); } })
    .to(fly, { x: x1, duration: 0.7, ease: 'power1.inOut' }, 0)
    .to(fly, { y: y1, duration: 0.7, ease: 'back.in(1.2)' }, 0)
    .to(fly, { rotation: 18, scale: 0.45, duration: 0.7, ease: 'power2.in' }, 0);
});

/* ================= panels: cart (avatar) and mobile menu ================= */
let openPanel = null, openBtn = null;
function togglePanel(btn, panel) {
  const was = openPanel === panel;
  closePanels();
  if (was) return;
  openPanel = panel; openBtn = btn; panel.hidden = false; btn.setAttribute('aria-expanded', 'true');
  if (!RM) gsap.fromTo(panel, { y: -14, opacity: 0, scale: 0.97 }, { y: 0, opacity: 1, scale: 1, duration: 0.3, ease: 'power3.out', transformOrigin: '90% 0%' });
  const first = panel.querySelector('a,button'); first && first.focus({ preventScroll: true });
}
function closePanels(returnFocus) {
  if (!openPanel) return;
  const p = openPanel, b = openBtn;
  openPanel = openBtn = null; b.setAttribute('aria-expanded', 'false'); p.hidden = true;
  if (returnFocus) b.focus({ preventScroll: true });
}
$('avatarBtn').addEventListener('click', e => togglePanel(e.currentTarget, $('acct')));
$('menuBtn').addEventListener('click', e => togglePanel(e.currentTarget, $('menu')));
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (openPanel) closePanels(true);
  else if (cardOpen) { closeCard(); stageBtn.focus({ preventScroll: true }); }
});
addEventListener('resize', () => { if (openPanel && innerWidth > 820 && openPanel.id === 'menu') closePanels(); });

/* ================= heart: favorite ================= */
const chatBtn = $('chat'), burst = $('burst');
for (let i = 0; i < 8; i++) burst.insertAdjacentHTML('beforeend', `<circle cx="1828" cy="992" r="${i % 2 ? 4 : 5.5}" fill="${[C.pink, C.orange, C.paper, C.blue][i % 4]}" opacity="0"/>`);
chatBtn.addEventListener('click', () => {
  const on = chatBtn.getAttribute('aria-pressed') !== 'true';
  chatBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  live.textContent = on ? 'Saved to your favorites' : 'Removed from your favorites';
  if (RM) return;
  gsap.fromTo('#heart', { scale: 0.5, transformOrigin: '50% 60%' }, { scale: 1, duration: 0.45, ease: 'back.out(3)' });
  if (on) [...burst.children].forEach((c, i) => {
    const a = i / 8 * Math.PI * 2 - Math.PI / 2;
    gsap.fromTo(c, { attr: { cx: 1828, cy: 992 }, opacity: 1 }, { attr: { cx: 1828 + Math.cos(a) * 64, cy: 992 + Math.sin(a) * 64 }, opacity: 0, duration: 0.6, ease: 'power2.out' });
  });
});

/* ================= render loop ================= */
function frame() {
  const now = gsap.ticker.time;
  const t = Math.min(14.999, tOf(P.p));
  const c = chapterOf(t);
  if (c !== chapter) { const prev = chapter; chapter = c; onChapter(c, prev); }
  if (S.playing || S.energy > 0) {
    S.beat = Music.beat();
    const bi = Math.floor(S.beat);
    if (S.playing && bi >= 0 && bi !== lastBeat) { lastBeat = bi; spawnRings(now); }
  }
  S.night = RM ? S.v : ease('power1.inOut')(S.v);
  setT(wrap, `translate(${f2(BX - S.pan * SC)}px,${f2(BY)}px) scale(${SC.toFixed(5)})`);
  renderColors(t);
  renderSheets(t);
  if (posterOn) renderPoster(t, now);
  if (mapOn) renderMap(t, now);
  renderOverlay(now);
  renderTicket(t);
  renderTod();
}
renderCart(false);
frame();
gsap.ticker.add(frame);
addEventListener('resize', layout);

/* ================= opening ================= */
const hashLabel = { '#map': 'map', '#tickets': 'tickets', '#finale': 'finale' }[location.hash];
const fontsReady = Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]);
fontsReady.then(() => {
  ScrollTrigger.refresh();
  if (hashLabel) {
    S.intro = 9;
    window.scrollTo(0, Math.round(ST.labelToScroll(hashLabel)));
    ST.update(); const tw = ST.getTween && ST.getTween(); if (tw) tw.progress(1);
  } else if (!RM) {
    gsap.to(S, { intro: 1.8, duration: 1.8, ease: 'none' });
    gsap.from('.ni', { y: -24, opacity: 0, duration: 0.5, stagger: 0.05, delay: 0.15, ease: 'power2.out', clearProps: 'transform,opacity' });
    gsap.from(chatBtn, { scale: 0, duration: 0.5, delay: 1.1, ease: 'back.out(2)', clearProps: 'transform' });
  }
  rootEl.dataset.ready = '1';
});
window.site = { S, goto, get chapter() { return chapter; }, get cart() { return cart; }, ST };
})();
</script>
</body>
</html>
